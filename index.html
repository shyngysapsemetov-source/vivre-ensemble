<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">
    <meta name="color-scheme" content="light dark">
    <title>Vivre Ensemble &mdash; Luxembourg Citizenship</title>
    <style>
        /* ================= DESIGN TOKENS =================
           Text colours are chosen for WCAG AA (>= 4.5:1) on every surface they
           sit on, in both schemes. "-text" variants are for coloured text; "-bg"
           variants are for filled buttons carrying white text. */
        :root {
            --bg: #f4f5f7;
            --surface: #ffffff;
            --surface-2: #f1f3f6;
            --border: #dde2e8;
            --border-strong: #b9c1cc;
            --text: #111827;          /* 17:1 on white */
            --text-2: #374151;        /* 10:1 on white */
            --muted: #566070;         /* 6.3:1 on white, 5.6:1 on surface-2 */

            --primary-bg: #c21f32;    /* white text 5.9:1 */
            --primary-bg-hover: #a51a2a;
            --primary-text: #b01c2d;  /* 6.6:1 on white */
            --primary-soft: rgba(194, 31, 50, 0.08);
            --accent-text: #0a6a90;   /* 6.0:1 on white */
            --accent-soft: rgba(10, 106, 144, 0.09);
            --success: #1b7a55;       /* 5.3:1 on white */
            --success-soft: rgba(27, 122, 85, 0.10);
            --error: #b42318;         /* 6.4:1 on white */
            --error-soft: rgba(180, 35, 24, 0.08);
            --warn: #8a5300;          /* 6.3:1 on white */
            --warn-soft: rgba(217, 140, 0, 0.13);
            --m1: #b01c2d; --m2: #0a6a90; --m3: #1b7a55;

            --header-bg: #0f172a;
            --radius: 16px;
            --radius-sm: 11px;
            --radius-xs: 7px;
            --sidebar-w: 248px;
            --header-h: 60px;
            --nav-h: 66px;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-top: env(safe-area-inset-top, 0px);
            --ease: cubic-bezier(0.22, 1, 0.36, 1);
            --shadow: 0 1px 2px rgba(16, 24, 40, 0.05), 0 1px 3px rgba(16, 24, 40, 0.04);
            --shadow-lg: 0 10px 30px rgba(16, 24, 40, 0.10);
            --focus: 0 0 0 3px rgba(10, 106, 144, 0.35);
            --mono: ui-monospace, 'SF Mono', 'Cascadia Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0b0f14;
                --surface: #151a21;
                --surface-2: #1d232c;
                --border: #2a323d;
                --border-strong: #444e5b;
                --text: #e8edf3;      /* 14:1 on surface */
                --text-2: #c3ccd7;    /* 10:1 */
                --muted: #9aa5b3;     /* 6.9:1 on surface, 6.1:1 on surface-2 */
                --primary-bg: #c21f32;
                --primary-bg-hover: #d62c40;
                --primary-text: #ff8d97; /* 7.4:1 on surface */
                --primary-soft: rgba(255, 141, 151, 0.10);
                --accent-text: #6cc6ec;  /* 8.6:1 */
                --accent-soft: rgba(108, 198, 236, 0.10);
                --success: #4cc790;      /* 8.4:1 */
                --success-soft: rgba(76, 199, 144, 0.12);
                --error: #ff8a80;        /* 7.6:1 */
                --error-soft: rgba(255, 138, 128, 0.10);
                --warn: #f0b458;         /* 9:1 */
                --warn-soft: rgba(240, 180, 88, 0.12);
                --m1: #ff8d97; --m2: #6cc6ec; --m3: #4cc790;
                --header-bg: #0a0e13;
                --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
                --shadow-lg: 0 10px 30px rgba(0, 0, 0, 0.5);
                --focus: 0 0 0 3px rgba(108, 198, 236, 0.45);
            }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
        body {
            font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            font-size: 16px;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
            padding-bottom: calc(var(--nav-h) + var(--safe-bottom));
            min-height: 100vh;
        }
        button { font-family: inherit; color: inherit; }
        :focus-visible { outline: none; box-shadow: var(--focus); }
        .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
        strong { font-weight: 700; }

        /* ================= HEADER ================= */
        .app-header {
            position: sticky; top: 0; z-index: 50;
            background: var(--header-bg);
            color: #fff;
            padding: calc(0.7rem + var(--safe-top)) 1rem 0.7rem;
            min-height: var(--header-h);
        }
        .app-header::after {
            content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 3px;
            background: linear-gradient(90deg, #ed2939 0 33.3%, #ffffff 33.3% 66.6%, #00a1de 66.6%);
        }
        .header-row { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; max-width: 1400px; margin: 0 auto; }
        .brand { display: flex; align-items: center; gap: 0.65rem; min-width: 0; }
        .brand-flag { width: 26px; height: 18px; border-radius: 3px; overflow: hidden; flex-shrink: 0; box-shadow: 0 0 0 1px rgba(255,255,255,0.25); }
        .brand-flag div { height: 33.34%; }
        .brand-flag .r { background: #ed2939; } .brand-flag .w { background: #fff; } .brand-flag .b { background: #00a1de; }
        .brand-text { min-width: 0; }
        .brand h1 { font-size: 1rem; font-weight: 800; letter-spacing: -0.01em; line-height: 1.15; white-space: nowrap; }
        .brand .sub { font-size: 0.72rem; color: #cbd5e1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .header-right { display: flex; align-items: center; gap: 0.5rem; min-width: 0; }
        .exam-badge {
            display: none;
            font-size: 0.72rem; font-weight: 700; color: #e2e8f0;
            border: 1px solid rgba(255,255,255,0.22); border-radius: 999px; padding: 0.3rem 0.65rem; white-space: nowrap;
        }
        .profile-chip {
            display: inline-flex; align-items: center; gap: 0.4rem; min-width: 0; max-width: 55vw;
            background: rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.25);
            color: #fff; border-radius: 999px; padding: 0.35rem 0.75rem; cursor: pointer;
            font-size: 0.8rem; font-weight: 700; min-height: 36px;
        }
        .profile-chip:hover { background: rgba(255,255,255,0.18); }
        .profile-chip .pc-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .profile-chip .pc-days { font-weight: 600; color: #cbd5e1; white-space: nowrap; }
        .profile-chip .pc-avatar {
            width: 22px; height: 22px; border-radius: 50%; background: #ed2939; color: #fff;
            display: inline-flex; align-items: center; justify-content: center; font-size: 0.72rem; font-weight: 800; flex-shrink: 0;
        }
        @media (min-width: 640px) { .exam-badge { display: inline-block; } }

        /* ================= LAYOUT ================= */
        .layout { display: grid; grid-template-columns: 1fr; max-width: 1400px; margin: 0 auto; }
        .side-nav { display: none; }
        main { padding: 1.1rem 1rem 2rem; max-width: 800px; margin: 0 auto; width: 100%; }
        .view { animation: viewIn 0.3s var(--ease); }
        @keyframes viewIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

        /* ================= TYPE & CARDS ================= */
        .card {
            background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
            padding: 1.2rem; margin-bottom: 1rem; box-shadow: var(--shadow); position: relative;
        }
        .card > h2, .page-title { font-size: 1.2rem; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 0.6rem; line-height: 1.25; }
        .card > h3 { font-size: 1rem; font-weight: 700; margin: 1rem 0 0.45rem; }
        .card p { font-size: 0.95rem; color: var(--text-2); }
        .card ul { padding-left: 1.15rem; margin: 0.4rem 0; }
        .card li { font-size: 0.93rem; color: var(--text-2); margin-bottom: 0.3rem; }
        .card h4 { font-size: 0.92rem; font-weight: 700; margin: 0.8rem 0 0.3rem; }
        .card-hero { background: var(--surface); }
        .lead { color: var(--text-2); font-size: 0.95rem; margin-bottom: 1rem; }
        .eyebrow, .section-label {
            font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted);
        }
        .section-label { margin: 1.6rem 0 0.65rem; padding-left: 0.15rem; }
        .muted { color: var(--muted); }

        /* ================= BUTTONS ================= */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem;
            padding: 0.7rem 1.1rem; border: 1px solid transparent; border-radius: var(--radius-sm);
            cursor: pointer; font-size: 0.92rem; font-weight: 700; min-height: 46px; line-height: 1.2;
            transition: background 0.15s var(--ease), border-color 0.15s var(--ease), transform 0.1s;
            text-decoration: none; text-align: center;
        }
        .btn:active { transform: scale(0.98); }
        .btn[disabled] { opacity: 0.45; cursor: not-allowed; }
        .btn-primary { background: var(--primary-bg); color: #fff; }
        .btn-primary:hover { background: var(--primary-bg-hover); }
        .btn-secondary { background: var(--surface); color: var(--text); border-color: var(--border-strong); }
        .btn-secondary:hover { border-color: var(--accent-text); color: var(--accent-text); }
        .btn-ghost { background: transparent; color: var(--accent-text); }
        .btn-full { width: 100%; }
        .btn-sm { padding: 0.45rem 0.8rem; font-size: 0.84rem; min-height: 38px; border-radius: 9px; }
        .btn-link { background: none; border: none; color: var(--accent-text); font-weight: 700; cursor: pointer; text-decoration: underline; font-size: inherit; padding: 0; }
        .btn-tiny {
            font-size: 0.76rem; font-weight: 700; padding: 0.35rem 0.7rem; border-radius: 8px; min-height: 32px;
            background: none; border: 1px solid var(--border-strong); color: var(--text-2); cursor: pointer;
        }
        .btn-tiny:hover { color: var(--accent-text); border-color: var(--accent-text); }
        .btn-tiny-danger:hover { color: var(--error); border-color: var(--error); }
        .btn-back {
            display: inline-flex; align-items: center; gap: 0.35rem; background: none; border: none; cursor: pointer;
            color: var(--accent-text); font-weight: 700; font-size: 0.88rem; padding: 0.4rem 0; margin-bottom: 0.5rem; min-height: 40px;
        }
        .btn-back:hover { text-decoration: underline; }
        kbd {
            display: inline-block; font-family: var(--mono); font-size: 0.72rem; line-height: 1.3;
            border: 1px solid var(--border-strong); border-bottom-width: 2px; border-radius: 4px; padding: 0 0.3rem;
            background: var(--surface); color: var(--text-2);
        }
        .btn-primary kbd { background: rgba(255,255,255,0.15); color: #fff; border-color: rgba(255,255,255,0.4); }
        .actions { display: flex; gap: 0.6rem; flex-wrap: wrap; margin-top: 1rem; }
        .actions .btn { flex: 1 1 auto; }

        /* ================= HOME ================= */
        .home-hero {
            padding: 1.3rem 1.2rem; border-radius: var(--radius); margin-bottom: 1rem;
            background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow);
            border-top: 4px solid var(--primary-bg);
        }
        .home-hero h2 { font-size: 1.45rem; font-weight: 800; letter-spacing: -0.025em; line-height: 1.2; margin: 0.2rem 0 0.35rem; }
        .home-hero p { font-size: 0.93rem; color: var(--text-2); max-width: 52ch; }
        .exam-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; margin-top: 0.9rem; }
        .stat-pill { background: var(--surface-2); border-radius: var(--radius-sm); padding: 0.55rem 0.5rem; text-align: center; }
        .stat-pill .num { display: block; font-size: 1.15rem; font-weight: 800; color: var(--text); line-height: 1.1; font-variant-numeric: tabular-nums; }
        .stat-pill .lbl { font-size: 0.7rem; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }

        .banner {
            display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap;
            background: var(--accent-soft); border: 1px solid var(--border); border-left: 4px solid var(--accent-text);
            border-radius: var(--radius-sm); padding: 0.8rem 1rem; margin-bottom: 1rem; font-size: 0.9rem; color: var(--text);
        }
        .banner p { flex: 1 1 16rem; }

        /* Today card */
        .today-card { border-left: 4px solid var(--accent-text); }
        .today-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.75rem; }
        .today-title { font-size: 1.2rem; font-weight: 800; letter-spacing: -0.02em; margin-top: 0.1rem; line-height: 1.25; }
        .today-note { font-size: 0.86rem !important; margin-top: 0.3rem; }
        .streak {
            display: flex; flex-direction: column; align-items: center; flex-shrink: 0;
            background: var(--surface-2); border-radius: var(--radius-sm); padding: 0.4rem 0.7rem; min-width: 4.2rem;
            font-size: 1.1rem; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums;
        }
        .streak span { font-size: 0.66rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
        .streak.is-on { background: var(--warn-soft); }
        .task-list { list-style: none; padding: 0 !important; margin: 0.9rem 0 0 !important; }
        .task { display: flex; align-items: center; gap: 0.7rem; padding: 0.6rem 0; border-top: 1px solid var(--border); margin: 0 !important; }
        .task-check {
            width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--border-strong); flex-shrink: 0;
            display: inline-flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 900; color: #fff;
        }
        .task.is-done .task-check { background: var(--success); border-color: var(--success); }
        .task-body { flex: 1; min-width: 0; }
        .task-label { display: block; font-weight: 700; font-size: 0.93rem; color: var(--text); line-height: 1.35; }
        .task.is-done .task-label { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }
        .task-sub { display: block; font-size: 0.8rem; color: var(--muted); line-height: 1.4; }
        .task-go { flex-shrink: 0; }

        /* Readiness */
        .ready-top { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
        .ready-big { font-size: 2.4rem; font-weight: 900; letter-spacing: -0.04em; line-height: 1; font-variant-numeric: tabular-nums; }
        .ready-big.is-good { color: var(--success); } .ready-big.is-mid { color: var(--warn); } .ready-big.is-low { color: var(--error); }
        .ready-sub { flex: 1 1 14rem; font-size: 0.88rem; color: var(--text-2); }
        .conf-tag { display: inline-block; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; padding: 0.1rem 0.45rem; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
        .ready-note { font-size: 0.8rem !important; color: var(--muted) !important; margin-top: 0.7rem; line-height: 1.5; }
        .progress-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.5rem; margin-top: 0.9rem; }
        @media (min-width: 520px) { .progress-stats { grid-template-columns: repeat(4, 1fr); } }
        .pstat { background: var(--surface-2); border-radius: var(--radius-sm); padding: 0.55rem 0.5rem; text-align: center; border: 1px solid transparent; }
        .pstat .pval { display: block; font-size: 1.05rem; font-weight: 800; font-variant-numeric: tabular-nums; }
        .pstat .plbl { display: block; font-size: 0.68rem; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
        .pstat.is-pass { background: var(--success-soft); border-color: var(--success); } .pstat.is-pass .pval { color: var(--success); }
        .pstat.is-fail { background: var(--error-soft); border-color: var(--error); } .pstat.is-fail .pval { color: var(--error); }

        .mod-bar-row { display: flex; align-items: center; gap: 0.6rem; padding: 0.45rem 0; }
        .mod-bar-row + .mod-bar-row { border-top: 1px solid var(--border); }
        .mod-bar-label { flex: 0 0 44%; display: flex; align-items: center; gap: 0.35rem; flex-wrap: wrap; font-size: 0.86rem; font-weight: 700; }
        .mod-weight { font-size: 0.72rem; font-weight: 600; color: var(--muted); }
        .mod-bar { flex: 1 1 auto; height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; position: relative; }
        .mod-bar-fill { height: 100%; border-radius: 4px; }
        .mod-bar .pass-tick { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--text); opacity: 0.55; }
        .mod-fill-1 { background: var(--m1); } .mod-fill-2 { background: var(--m2); } .mod-fill-3 { background: var(--m3); }
        .mod-bar-val { flex: 0 0 3.4rem; text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 0.82rem; font-weight: 700; color: var(--text-2); }

        /* Mode tiles and practice tiles */
        .mode-picker { display: grid; grid-template-columns: 1fr; gap: 0.6rem; }
        .mode-tile, .practice-tile {
            background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
            padding: 1rem 1.05rem; cursor: pointer; text-align: left; width: 100%;
            transition: border-color 0.15s var(--ease), box-shadow 0.15s var(--ease), transform 0.15s var(--ease);
            box-shadow: var(--shadow);
        }
        .mode-tile { display: flex; gap: 0.85rem; align-items: flex-start; }
        .mode-tile:hover, .practice-tile:hover { border-color: var(--accent-text); box-shadow: var(--shadow-lg); transform: translateY(-1px); }
        .mode-icon, .p-icon { font-size: 1.5rem; line-height: 1; flex-shrink: 0; }
        .mode-body { min-width: 0; display: block; }
        .mode-title, .p-title { display: block; font-size: 0.98rem; font-weight: 800; letter-spacing: -0.01em; margin-bottom: 0.15rem; }
        .mode-desc, .p-desc { display: block; font-size: 0.84rem; color: var(--text-2); line-height: 1.45; }
        .mode-arrow { margin-left: auto; color: var(--muted); font-size: 1.3rem; align-self: center; }
        .practice-hub { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }
        .practice-tile .p-icon { display: block; margin-bottom: 0.4rem; }
        .practice-tile.is-featured { grid-column: 1 / -1; border-left: 4px solid var(--accent-text); }
        .review-stack { display: flex; flex-direction: column; gap: 0.6rem; }

        /* Journey */
        .journey-item { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.1rem; margin-bottom: 0.8rem; box-shadow: var(--shadow); }
        .journey-header { display: flex; align-items: center; gap: 0.7rem; margin-bottom: 0.7rem; }
        .j-icon { font-size: 1.4rem; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; background: var(--surface-2); border-radius: 11px; flex-shrink: 0; }
        .journey-header h3 { font-size: 1.02rem; font-weight: 800; line-height: 1.25; }
        .j-sub { font-size: 0.82rem; color: var(--muted); }
        .journey-content p, .journey-content li { font-size: 0.92rem; color: var(--text-2); margin-bottom: 0.45rem; }
        .journey-content ul { padding-left: 1.1rem; }
        .fact-table { display: grid; grid-template-columns: max-content 1fr; gap: 0.4rem 1rem; }
        .fact-table dt { font-size: 0.76rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; padding-top: 0.12rem; }
        .fact-table dd { font-size: 0.92rem; }
        .journey-followup { margin-top: 0.8rem; padding-top: 0.7rem; border-top: 1px dashed var(--border); font-size: 0.86rem; color: var(--muted); font-style: italic; }

        /* ================= STORY ================= */
        .chapter-card {
            display: block; width: 100%; text-align: left; cursor: pointer;
            background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--primary-bg);
            border-radius: var(--radius); padding: 1rem 1.1rem; margin-bottom: 0.75rem; box-shadow: var(--shadow);
            transition: border-color 0.15s var(--ease), box-shadow 0.15s var(--ease);
        }
        .chapter-card:hover { box-shadow: var(--shadow-lg); border-color: var(--accent-text); border-left-color: var(--primary-bg); }
        .chapter-card.is-read { border-left-color: var(--success); }
        .chapter-num { display: block; font-size: 0.72rem; font-weight: 800; color: var(--primary-text); letter-spacing: 0.1em; text-transform: uppercase; }
        .chapter-title { display: block; font-size: 1.12rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1.25; margin: 0.1rem 0 0.2rem; }
        .chapter-era { display: block; font-family: var(--mono); font-size: 0.8rem; color: var(--accent-text); font-weight: 700; }
        .chapter-subtitle { display: block; font-size: 0.88rem; color: var(--text-2); font-style: italic; margin-top: 0.2rem; }
        .read-badge {
            display: inline-block; font-size: 0.68rem; font-weight: 800; color: var(--success); background: var(--success-soft);
            border-radius: 999px; padding: 0.05rem 0.5rem; margin-left: 0.4rem; letter-spacing: 0.02em; text-transform: none; vertical-align: middle;
        }
        .read-status { display: inline-block; font-size: 0.88rem; font-weight: 700; color: var(--success); padding: 0.5rem 0.9rem; background: var(--success-soft); border-radius: 999px; }
        .resume-bar {
            display: flex; align-items: center; gap: 0.75rem; width: 100%; text-align: left; cursor: pointer;
            padding: 0.8rem 1rem; margin-bottom: 0.9rem; background: var(--accent-soft);
            border: 1px solid var(--border); border-radius: var(--radius-sm);
        }
        .resume-bar.is-done { cursor: default; background: var(--success-soft); }
        .resume-body { display: flex; flex-direction: column; min-width: 0; flex: 1; }
        .resume-label { font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
        .resume-title { font-size: 0.96rem; font-weight: 700; }
        .resume-arrow { color: var(--accent-text); font-size: 1.4rem; }
        .chapter-hook {
            font-size: 1rem; line-height: 1.75; margin: 1rem 0; padding: 1rem 1.1rem;
            background: var(--surface-2); border-left: 3px solid var(--primary-bg); border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
        }
        .chapter-hook p { margin: 0 0 0.85rem; color: var(--text); font-size: 0.98rem; }
        .chapter-hook p:last-child { margin-bottom: 0; }
        .chapter-hook .hook-h { font-size: 0.98rem; font-weight: 800; margin: 1.1rem 0 0.35rem; line-height: 1.3; }
        .chapter-hook .hook-h:first-child { margin-top: 0; }
        .chapter-hook strong { color: var(--primary-text); }
        .must-know { border-left: 4px solid var(--accent-text); }
        .must-know-label { font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; color: var(--accent-text); }
        .must-know h3 { font-size: 1.05rem; font-weight: 800; margin: 0.15rem 0 0.2rem; }
        .must-know-intro { font-size: 0.86rem; color: var(--text-2); margin-bottom: 0.7rem; }
        .must-know-list { list-style: none; padding: 0 !important; margin: 0; counter-reset: mk; }
        .must-know-list li { padding: 0.5rem 0 0.5rem 1.8rem; font-size: 0.92rem; color: var(--text); border-bottom: 1px dashed var(--border); position: relative; counter-increment: mk; margin: 0; }
        .must-know-list li:last-child { border-bottom: none; }
        .must-know-list li::before { content: counter(mk); position: absolute; left: 0; top: 0.55rem; font-size: 0.74rem; font-weight: 800; color: var(--accent-text); font-family: var(--mono); }
        .must-know-list strong { color: var(--primary-text); }
        .cultural-note { border-left: 4px solid var(--warn); }
        .cultural-note-label { font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; color: var(--warn); }
        .arc-list { list-style: none; padding-left: 0 !important; }
        .arc-list li { padding: 0.45rem 0 0.45rem 1.3rem; border-bottom: 1px dashed var(--border); position: relative; margin: 0; }
        .arc-list li:last-child { border-bottom: none; }
        .arc-list li::before { content: ''; position: absolute; left: 0.3rem; top: 0.95rem; width: 7px; height: 7px; border-radius: 50%; background: var(--primary-bg); }
        .unlock-row { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.4rem 0; }
        .unlock-chip { padding: 0.25rem 0.6rem; border-radius: 999px; font-size: 0.8rem; font-weight: 600; background: var(--accent-soft); color: var(--accent-text); }
        .unlock-chip.rights { background: var(--primary-soft); color: var(--primary-text); }
        .key-question { margin-top: 1rem; padding: 0.9rem 1rem; background: var(--warn-soft); border-radius: var(--radius-sm); }
        .kq-q { font-size: 0.74rem; font-weight: 800; color: var(--warn); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.3rem; }
        .kq-a { font-size: 0.93rem; color: var(--text); }
        .link-row {
            display: flex; align-items: center; gap: 0.7rem; width: 100%; padding: 0.7rem 0.4rem; background: none; border: none;
            border-bottom: 1px solid var(--border); cursor: pointer; text-align: left; border-radius: 0;
        }
        .link-row:last-child { border-bottom: none; }
        .link-row:hover { background: var(--surface-2); }
        .link-icon { font-size: 1.1rem; flex-shrink: 0; }
        .link-body { flex: 1; min-width: 0; display: flex; flex-direction: column; }
        .link-title { font-size: 0.93rem; font-weight: 700; }
        .link-sub { font-size: 0.78rem; color: var(--muted); }
        .link-arrow { color: var(--muted); font-size: 1.2rem; }
        .figure-grid { display: grid; grid-template-columns: 1fr; gap: 0.7rem; }
        .figure-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 0.9rem 1rem; }
        .figure-card h4 { font-size: 0.98rem; font-weight: 800; margin: 0; }
        .fig-role { font-size: 0.82rem; color: var(--accent-text); font-weight: 700; }
        .fig-years { font-family: var(--mono); font-size: 0.76rem; color: var(--muted); margin-bottom: 0.4rem; }
        .fig-summary { font-size: 0.9rem; color: var(--text-2); margin-bottom: 0.4rem; }
        .fig-matters { font-size: 0.88rem; padding: 0.5rem 0.7rem; background: var(--primary-soft); border-left: 3px solid var(--primary-bg); border-radius: 0 var(--radius-xs) var(--radius-xs) 0; }
        .fig-matters::before { content: 'Why it matters: '; font-weight: 800; color: var(--primary-text); }

        /* ================= SCENARIOS ================= */
        .scenario-card {
            display: block; width: 100%; text-align: left; cursor: pointer;
            background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
            padding: 1rem 1.1rem; margin-bottom: 0.7rem; box-shadow: var(--shadow);
        }
        .scenario-card:hover { border-color: var(--accent-text); box-shadow: var(--shadow-lg); }
        .scenario-card.is-seen { background: var(--surface-2); }
        .scenario-head { display: flex; align-items: center; gap: 0.7rem; margin-bottom: 0.4rem; }
        .s-icon { font-size: 1.4rem; width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; background: var(--accent-soft); border-radius: 10px; flex-shrink: 0; }
        .scenario-head h3 { font-size: 1rem; font-weight: 800; line-height: 1.3; }
        .scenario-premise { font-size: 0.9rem; color: var(--text-2); }
        .group-head { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
        .beat { padding: 0.85rem 1rem; margin: 0.7rem 0; border-left: 3px solid var(--accent-text); background: var(--surface-2); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }
        .beat-q { font-size: 0.92rem; font-weight: 800; color: var(--accent-text); margin-bottom: 0.3rem; }
        .beat-a { font-size: 0.94rem; color: var(--text); line-height: 1.7; }

        /* ================= TIMELINE ================= */
        .timeline-list { position: relative; padding-left: 1.3rem; }
        .timeline-list::before { content: ''; position: absolute; left: 0.35rem; top: 0.5rem; bottom: 0.5rem; width: 2px; background: var(--border-strong); }
        .tl-item { padding: 0.45rem 0; position: relative; display: flex; gap: 0.75rem; align-items: baseline; }
        .tl-item::before { content: ''; position: absolute; left: -1.2rem; top: 0.85rem; width: 9px; height: 9px; border-radius: 50%; background: var(--surface); border: 2px solid var(--primary-bg); }
        .tl-year { font-family: var(--mono); font-weight: 800; font-size: 0.86rem; color: var(--primary-text); min-width: 3.2rem; flex-shrink: 0; }
        .tl-event { font-size: 0.92rem; color: var(--text-2); }

        /* ================= REFERENCE ================= */
        .module-header { display: flex; align-items: center; gap: 0.7rem; margin-bottom: 0.5rem; }
        .module-badge { display: inline-block; padding: 0.18rem 0.55rem; border-radius: 999px; font-size: 0.74rem; font-weight: 800; letter-spacing: 0.02em; white-space: nowrap; }
        .module-0 { background: var(--surface-2); color: var(--text-2); }
        .module-1 { background: var(--primary-soft); color: var(--m1); }
        .module-2 { background: var(--accent-soft); color: var(--m2); }
        .module-3 { background: var(--success-soft); color: var(--m3); }
        .study-section { border-bottom: 1px solid var(--border); }
        .study-section:last-of-type { border-bottom: none; }
        .study-section > summary {
            cursor: pointer; list-style: none; padding: 0.8rem 0; font-weight: 700; font-size: 0.95rem;
            display: flex; justify-content: space-between; align-items: center; gap: 0.5rem;
        }
        .study-section > summary::-webkit-details-marker { display: none; }
        .study-section > summary::after { content: '+'; font-size: 1.2rem; font-weight: 700; color: var(--muted); flex-shrink: 0; width: 1.2rem; text-align: center; }
        .study-section[open] > summary::after { content: '\2212'; color: var(--primary-text); }
        .study-section .content { padding: 0 0 1rem; font-size: 0.93rem; color: var(--text-2); }
        .study-section .content ul { margin: 0.4rem 0; padding-left: 1.2rem; }
        .study-section .content h4 { color: var(--text); }
        .study-section .content strong { color: var(--text); }
        .study-section .content table { border-collapse: collapse; width: 100%; font-size: 0.88rem; margin: 0.5rem 0; }
        .study-section .content td, .study-section .content th { border: 1px solid var(--border); padding: 0.3rem 0.5rem; text-align: left; }
        .sec-title { flex: 1; min-width: 0; }
        .sec-tick { color: var(--success); font-weight: 900; margin-right: 0.3rem; }
        .sec-foot { margin-top: 0.8rem; }
        .ref-search {
            display: flex; align-items: center; gap: 0.5rem; background: var(--surface); border: 1px solid var(--border-strong);
            border-radius: var(--radius-sm); padding: 0 0.75rem; margin-bottom: 0.4rem;
        }
        .ref-search:focus-within { border-color: var(--accent-text); box-shadow: var(--focus); }
        .ref-search input {
            flex: 1; min-width: 0; border: none; background: none; font-family: inherit; color: var(--text);
            font-size: 16px; /* iOS zooms on focus below 16px */
            padding: 0.7rem 0; min-height: 46px; -webkit-appearance: none; appearance: none;
        }
        .ref-search input:focus { outline: none; box-shadow: none; }
        .ref-search input::placeholder { color: var(--muted); opacity: 1; }
        .ref-search input::-webkit-search-cancel-button { display: none; }
        .ref-search-clear { border: none; background: none; cursor: pointer; font-size: 1.4rem; line-height: 1; color: var(--muted); padding: 0.2rem 0.3rem; }
        .ref-count { font-size: 0.82rem; color: var(--muted); font-weight: 600; min-height: 1.2rem; margin-bottom: 0.7rem; padding-left: 0.2rem; }
        .ref-sec-count { font-size: 0.76rem; color: var(--muted); font-weight: 600; margin-left: auto; }
        mark { background: var(--warn-soft); color: var(--text); border-radius: 3px; padding: 0 0.1em; box-shadow: inset 0 -2px 0 var(--warn); }

        /* ================= QUIZ / SESSIONS ================= */
        .quiz-header { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem; flex-wrap: wrap; }
        .quiz-header.is-timed {
            position: sticky; top: calc(var(--header-h) + var(--safe-top)); z-index: 20;
            margin: -1.2rem -1.2rem 0.6rem; padding: 0.6rem 1.2rem;
            background: var(--surface); border-bottom: 1px solid var(--border); border-radius: var(--radius) var(--radius) 0 0;
        }
        .quiz-meta { font-size: 0.85rem; color: var(--text-2); font-weight: 700; font-variant-numeric: tabular-nums; }
        .progress-bar { width: 100%; height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; margin: 0.5rem 0 1rem; }
        .progress-fill { height: 100%; background: var(--accent-text); border-radius: 3px; transition: width 0.3s var(--ease); }
        .quiz-setup-list { display: flex; flex-direction: column; }
        .quiz-setup-row { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; padding: 0.7rem 0; border-top: 1px solid var(--border); }
        .qs-main { display: flex; align-items: center; gap: 0.45rem; flex-wrap: wrap; flex: 1 1 12rem; min-width: 0; }
        .qs-name { font-size: 0.95rem; font-weight: 700; }
        .qs-meta { font-size: 0.8rem; color: var(--muted); font-weight: 600; flex-basis: 100%; }
        .qs-actions { display: flex; gap: 0.4rem; margin-left: auto; flex-shrink: 0; }
        .quiz-question { font-size: 1.1rem !important; font-weight: 700; margin-bottom: 1rem; line-height: 1.45; color: var(--text) !important; }
        .nq-kicker { display: block; font-size: 0.74rem; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.25rem; }
        .quiz-options { display: flex; flex-direction: column; gap: 0.5rem; }
        .quiz-option {
            padding: 0.8rem 0.95rem; border: 2px solid var(--border); border-radius: var(--radius-sm); cursor: pointer;
            font-size: 0.95rem; font-weight: 500; min-height: 52px; display: flex; align-items: center; gap: 0.7rem;
            background: var(--surface); width: 100%; text-align: left; appearance: none; line-height: 1.4;
            transition: border-color 0.15s var(--ease), background 0.15s var(--ease);
        }
        .quiz-option:hover:not([disabled]) { border-color: var(--accent-text); background: var(--accent-soft); }
        .key-hint { font-family: var(--mono); font-size: 0.74rem; background: var(--surface-2); border: 1px solid var(--border); padding: 0.1rem 0.4rem; border-radius: 4px; color: var(--text-2); flex-shrink: 0; }
        .quiz-option.selected { border-color: var(--accent-text); background: var(--accent-soft); font-weight: 700; }
        .quiz-option.selected .key-hint { background: var(--accent-text); color: var(--surface); border-color: var(--accent-text); }
        .quiz-option.correct { border-color: var(--success); background: var(--success-soft); font-weight: 700; }
        .quiz-option.correct::after { content: '\2713'; margin-left: auto; color: var(--success); font-weight: 900; }
        .quiz-option.incorrect { border-color: var(--error); background: var(--error-soft); }
        .quiz-option.incorrect::after { content: '\2717'; margin-left: auto; color: var(--error); font-weight: 900; }
        .quiz-option[disabled] { cursor: default; color: var(--text); }
        .quiz-option.dim { opacity: 0.6; }
        .quiz-explanation {
            margin-top: 1rem; padding: 0.85rem 1rem; background: var(--surface-2); border-left: 3px solid var(--accent-text);
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0; font-size: 0.93rem; color: var(--text-2);
        }
        .quiz-explanation.is-right { border-left-color: var(--success); }
        .quiz-explanation.is-wrong { border-left-color: var(--error); }
        .quiz-explanation .verdict-right { color: var(--success); } .quiz-explanation .verdict-wrong { color: var(--error); }
        .mnemonic { margin-top: 0.6rem; padding: 0.65rem 0.9rem; background: var(--warn-soft); border-radius: var(--radius-sm); font-size: 0.9rem; color: var(--text); }
        .mnemonic-label { display: block; font-size: 0.7rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--warn); }
        .confidence { margin-top: 1rem; }
        .confidence-label { display: block; font-size: 0.8rem; font-weight: 700; color: var(--muted); margin-bottom: 0.4rem; }
        .confidence-row { display: grid; grid-template-columns: 1fr 1.3fr 1fr; gap: 0.5rem; }
        .quiz-actions { display: flex; gap: 0.6rem; margin-top: 1rem; flex-wrap: wrap; }
        .quiz-abandon { margin-top: 1rem; padding-top: 0.8rem; border-top: 1px solid var(--border); display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap; }
        .kbd-hint { margin-top: 0.9rem; padding: 0.5rem 0.8rem; background: var(--surface-2); border-radius: var(--radius-sm); font-size: 0.8rem; color: var(--text-2); text-align: center; }
        @media (hover: none) { .kbd-hint { display: none; } }

        /* Mock exam */
        .exam-clock { font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 800; color: var(--accent-text); }
        .exam-clock.is-urgent { color: var(--error); animation: clockPulse 1s ease-in-out infinite; }
        @keyframes clockPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .exam-controls { display: grid; grid-template-columns: 1fr auto 1fr; gap: 0.5rem; margin-top: 1rem; }
        .btn-flag { background: var(--surface); border-color: var(--border-strong); color: var(--text-2); }
        .btn-flag.is-flagged { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
        .qgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 0.35rem; margin-top: 0.6rem; }
        .qcell {
            position: relative; height: 38px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--surface);
            font-size: 0.8rem; font-weight: 700; cursor: pointer; font-variant-numeric: tabular-nums; color: var(--text-2);
        }
        .qcell.is-answered { background: var(--accent-soft); border-color: var(--accent-text); color: var(--text); }
        .qcell.is-flagged::after { content: ''; position: absolute; top: 3px; right: 3px; width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
        .qcell.is-current { box-shadow: 0 0 0 2px var(--text); }
        .qgrid-legend { display: flex; gap: 0.9rem; flex-wrap: wrap; font-size: 0.76rem; color: var(--muted); margin-top: 0.5rem; }
        .qgrid-legend span::before { content: ''; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 0.3rem; vertical-align: -1px; border: 1px solid var(--border-strong); }
        .qgrid-legend .lg-ans::before { background: var(--accent-soft); border-color: var(--accent-text); }
        .qgrid-legend .lg-flag::before { background: var(--warn); border-color: var(--warn); border-radius: 50%; }
        .exam-summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; margin: 0.6rem 0 0.9rem; }
        .jump-list { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.4rem; }
        .hint-box { font-size: 0.88rem; color: var(--text); background: var(--warn-soft); border-radius: var(--radius-sm); padding: 0.7rem 0.9rem; margin-top: 0.8rem; }

        /* Results */
        .score-card { text-align: center; padding: 1.8rem 1rem; }
        .score-num { font-size: 3.6rem; font-weight: 900; letter-spacing: -0.04em; line-height: 1; font-variant-numeric: tabular-nums; }
        .score-label { color: var(--text-2); font-size: 1rem; margin-top: 0.4rem; font-weight: 600; }
        .score-verdict { margin-top: 0.8rem; font-size: 1.1rem; font-weight: 800; }
        .score-note { color: var(--muted); font-size: 0.86rem; margin-top: 0.3rem; }
        .is-pass-text { color: var(--success); } .is-fail-text { color: var(--error); }
        .timeout-banner { background: var(--error-soft); border: 1px solid var(--error); border-radius: var(--radius-sm); padding: 0.7rem 0.9rem; font-size: 0.88rem; font-weight: 600; color: var(--error); margin-bottom: 1rem; text-align: left; }
        .missed-item { border-bottom: 1px solid var(--border); }
        .missed-item:last-child { border-bottom: none; }
        .missed-item > summary { display: flex; align-items: flex-start; gap: 0.5rem; padding: 0.7rem 0.1rem; cursor: pointer; list-style: none; font-size: 0.9rem; line-height: 1.45; }
        .missed-item > summary::-webkit-details-marker { display: none; }
        .missed-item > summary::after { content: '+'; margin-left: auto; flex-shrink: 0; color: var(--muted); font-weight: 800; }
        .missed-item[open] > summary::after { content: '\2212'; }
        .missed-q { font-weight: 600; }
        .missed-body { padding: 0 0.1rem 0.9rem; }
        .missed-line { font-size: 0.88rem; padding: 0.35rem 0.6rem; border-radius: var(--radius-xs); margin-bottom: 0.35rem; }
        .missed-yours { background: var(--error-soft); color: var(--error); font-weight: 600; }
        .missed-right { background: var(--success-soft); color: var(--success); font-weight: 700; }
        .missed-why { font-size: 0.88rem; color: var(--text-2); margin-top: 0.4rem; }

        /* Flashcards */
        .flashcard-wrap { margin: 0.8rem 0; }
        .flashcard {
            min-height: 210px; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.6rem;
            text-align: center; cursor: pointer; background: var(--surface-2); border: 2px solid var(--border);
            border-radius: var(--radius); padding: 1.8rem 1.3rem; user-select: none;
        }
        .flashcard:hover { border-color: var(--accent-text); }
        .flashcard-front { font-size: 1.2rem; font-weight: 700; line-height: 1.4; }
        .flashcard-q-small { font-size: 0.9rem; color: var(--muted); font-weight: 600; }
        .flashcard-back { font-size: 1.12rem; color: var(--primary-text); font-weight: 700; line-height: 1.5; }
        .flashcard-counter { text-align: center; font-size: 0.84rem; color: var(--muted); font-weight: 700; }
        .flashcard-controls { display: flex; gap: 0.5rem; margin-top: 0.8rem; }
        .flashcard-controls .btn { flex: 1; }
        .grade-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.4rem; margin-top: 0.8rem; }
        .grade-btn { flex-direction: column; gap: 0.1rem; padding: 0.5rem 0.3rem; min-height: 58px; }
        .grade-int { font-size: 0.72rem; font-weight: 600; opacity: 0.85; }
        .grade-1 { color: var(--error); } .grade-1:hover { border-color: var(--error); color: var(--error); }
        .grade-2 { color: var(--warn); } .grade-2:hover { border-color: var(--warn); color: var(--warn); }

        /* Plan */
        .field { display: flex; flex-direction: column; gap: 0.3rem; flex: 1 1 12rem; }
        .field label { font-size: 0.8rem; font-weight: 700; color: var(--text-2); }
        .field input, .inline-form input {
            font-family: inherit; font-size: 16px; color: var(--text); background: var(--surface);
            border: 1px solid var(--border-strong); border-radius: var(--radius-sm); padding: 0.6rem 0.75rem; min-height: 46px; width: 100%;
        }
        .field input:focus, .inline-form input:focus { outline: none; border-color: var(--accent-text); box-shadow: var(--focus); }
        .field-help { font-size: 0.78rem; color: var(--muted); }
        .field-row { display: flex; gap: 0.8rem; flex-wrap: wrap; }
        .plan-day { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 0.75rem 0.95rem; margin-bottom: 0.5rem; }
        .plan-day.is-today { border: 2px solid var(--accent-text); }
        .plan-day.is-final { border-left: 4px solid var(--warn); }
        .plan-day.is-exam { border-left: 4px solid var(--primary-bg); background: var(--primary-soft); }
        .plan-day-head { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; font-weight: 800; font-size: 0.92rem; }
        .phase-tag { font-size: 0.68rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; padding: 0.1rem 0.45rem; border-radius: 999px; background: var(--surface-2); color: var(--text-2); }
        .phase-tag.final { background: var(--warn-soft); color: var(--warn); }
        .phase-tag.exam { background: var(--primary-soft); color: var(--primary-text); }
        .plan-tasks { list-style: none; margin: 0.35rem 0 0 !important; padding: 0 !important; }
        .plan-tasks li { font-size: 0.86rem !important; color: var(--text-2); padding: 0.12rem 0 0.12rem 1rem; position: relative; margin: 0 !important; }
        .plan-tasks li::before { content: ''; position: absolute; left: 0.2rem; top: 0.62rem; width: 5px; height: 5px; border-radius: 50%; background: var(--muted); }
        .plan-tasks li.is-done { color: var(--muted); text-decoration: line-through; }
        .plan-tasks li.t-mock { font-weight: 700; color: var(--text); }
        .plan-tasks li.t-mock::before { background: var(--primary-bg); }

        /* Profiles */
        .profile-row { display: flex; align-items: center; gap: 0.7rem; padding: 0.75rem 0; border-top: 1px solid var(--border); flex-wrap: wrap; }
        .profile-row:first-of-type { border-top: none; }
        .profile-avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--surface-2); display: inline-flex; align-items: center; justify-content: center; font-weight: 800; flex-shrink: 0; }
        .profile-row.is-active .profile-avatar { background: var(--primary-bg); color: #fff; }
        .profile-info { flex: 1 1 10rem; min-width: 0; }
        .profile-name { font-weight: 800; font-size: 0.98rem; overflow-wrap: anywhere; }
        .profile-sub { font-size: 0.8rem; color: var(--muted); }
        .profile-actions { display: flex; gap: 0.35rem; flex-wrap: wrap; }
        .inline-form { display: flex; gap: 0.5rem; margin-top: 0.6rem; flex-wrap: wrap; }
        .inline-form input { flex: 1 1 12rem; }

        /* Tips & cheat sheet */
        .tip-card h3 { font-size: 1.02rem; font-weight: 800; margin: 0 0 0.35rem; }
        .tip-num { display: inline-flex; width: 1.6rem; height: 1.6rem; border-radius: 50%; background: var(--accent-soft); color: var(--accent-text); align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 800; margin-right: 0.4rem; }
        .tip-body { font-size: 0.93rem; color: var(--text-2); }
        .tip-body p + p { margin-top: 0.5rem; }
        .cheat-grid { display: grid; grid-template-columns: 1fr; gap: 1rem; }
        .cheat-block h3 { font-size: 0.95rem; font-weight: 800; margin: 0 0 0.4rem; display: flex; gap: 0.4rem; align-items: center; }
        .cheat-table { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
        .cheat-table td { padding: 0.25rem 0.3rem; border-bottom: 1px solid var(--border); vertical-align: top; color: var(--text-2); }
        .cheat-table td:first-child { font-family: var(--mono); font-weight: 800; color: var(--text); white-space: nowrap; width: 1%; padding-right: 0.7rem; }
        .cheat-tl { columns: 1; column-gap: 1.5rem; font-size: 0.84rem; }
        .cheat-tl div { break-inside: avoid; padding: 0.15rem 0; color: var(--text-2); }
        .cheat-tl b { font-family: var(--mono); color: var(--text); display: inline-block; min-width: 2.9rem; }
        .print-only { display: none; }
        @media (min-width: 700px) { .cheat-tl { columns: 2; } .cheat-grid { grid-template-columns: 1fr 1fr; } }

        /* ================= NAV ================= */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
            padding: 0.35rem 0.25rem calc(0.35rem + var(--safe-bottom));
            background: var(--surface); border-top: 1px solid var(--border);

        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; gap: 0.1rem; background: none; border: none;
            color: var(--text-2); font-size: 0.7rem; font-weight: 700; padding: 0.35rem 0.4rem; border-radius: 10px;
            cursor: pointer; min-width: 56px; min-height: 48px; position: relative;
        }
        .nav-item.active { color: var(--primary-text); background: var(--primary-soft); }
        .nav-item .nav-icon { font-size: 1.3rem; line-height: 1; }
        .nav-badge {
            position: absolute; top: 0.1rem; right: 0.35rem; min-width: 1.1rem; height: 1.1rem; padding: 0 0.25rem; border-radius: 999px;
            background: var(--primary-bg); color: #fff; font-size: 0.62rem; font-weight: 800; line-height: 1.1rem; text-align: center;
        }
        .side-nav .nav-badge { position: static; margin-left: auto; }

        @media (min-width: 1024px) {
            body { padding-bottom: 0; }
            .layout { grid-template-columns: var(--sidebar-w) 1fr; gap: 2rem; padding: 0 2rem; }
            .side-nav {
                display: block; position: sticky; top: calc(var(--header-h) + 1rem); align-self: start;
                padding: 1.2rem 0; max-height: calc(100vh - var(--header-h) - 2rem); overflow-y: auto;
            }
            .side-nav-title { font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); padding: 0 0.8rem 0.5rem; }
            .side-nav nav { display: flex; flex-direction: column; gap: 0.15rem; }
            .side-nav nav button {
                display: flex; align-items: center; gap: 0.7rem; width: 100%; padding: 0.6rem 0.8rem; border: none; border-radius: 10px;
                background: none; font-size: 0.93rem; font-weight: 600; color: var(--text-2); text-align: left; cursor: pointer;
            }
            .side-nav nav button:hover { background: var(--surface); color: var(--text); }
            .side-nav nav button.active { background: var(--surface); color: var(--primary-text); font-weight: 800; box-shadow: var(--shadow); }
            .side-nav nav .nav-icon { font-size: 1.1rem; width: 1.3rem; text-align: center; }
            .side-nav nav .shortcut { margin-left: auto; font-family: var(--mono); font-size: 0.72rem; color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 0 0.35rem; }
            .side-nav nav .nav-badge + .shortcut { margin-left: 0.4rem; }
            .side-nav-footer { margin-top: 1.2rem; padding: 0.9rem 0.8rem; border-top: 1px solid var(--border); font-size: 0.8rem; color: var(--text-2); line-height: 1.6; }
            .bottom-nav { display: none; }
            main { padding: 1.8rem 0; max-width: 820px; }
            .home-hero { padding: 1.7rem 1.8rem; }
            .home-hero h2 { font-size: 1.8rem; }
            .practice-hub { grid-template-columns: repeat(4, 1fr); }
            .mode-picker { grid-template-columns: repeat(3, 1fr); }
            .mode-tile { flex-direction: column; }
            .mode-arrow { display: none; }
        }
        @media (min-width: 1280px) { .figure-grid { grid-template-columns: 1fr 1fr; } }

        @media (prefers-reduced-motion: reduce) {
            html { scroll-behavior: auto; }
            *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
            .exam-clock.is-urgent { text-decoration: underline; }
        }

        /* ================= PRINT =================
           Reference, timeline and the cheat sheet print cleanly: chrome hidden,
           black on white, every accordion expanded (see beforeprint handler). */
        @media print {
            @page { margin: 12mm; }
            :root {
                --bg: #fff; --surface: #fff; --surface-2: #fff; --border: #bbb; --border-strong: #888;
                --text: #000; --text-2: #111; --muted: #333; --primary-text: #000; --accent-text: #000;
                --success: #000; --error: #000; --warn: #000; --m1: #000; --m2: #000; --m3: #000;
            }
            body { padding: 0; background: #fff; font-size: 11pt; line-height: 1.4; }
            .app-header, .side-nav, .bottom-nav, .btn, .btn-tiny, .btn-back, .ref-search, .ref-count, .no-print, .kbd-hint, .sec-foot { display: none !important; }
            .layout { display: block; padding: 0; }
            main { max-width: none; padding: 0; }
            .view { animation: none; }
            .card, .journey-item, .figure-card, .plan-day { box-shadow: none; border: none; padding: 0; margin: 0 0 0.6rem; break-inside: auto; }
            .study-section { break-inside: avoid-page; border-bottom: 1px solid #ccc; }
            .study-section > summary { padding: 0.3rem 0; }
            .study-section > summary::after { display: none; }
            .module-header { margin-top: 0.8rem; }
            mark { background: none; box-shadow: none; }
            .timeline-list::before, .tl-item::before { display: none; }
            .timeline-list { padding-left: 0; }
            .tl-item { padding: 0.1rem 0; break-inside: avoid; }
            .print-only { display: block; }
            .section-label { margin: 0.6rem 0 0.3rem; }
            /* One-page cheat sheet: dense three-column flow. */
            .cheat-sheet { font-size: 8.5pt; line-height: 1.25; }
            .cheat-sheet .page-title { font-size: 13pt; margin: 0 0 0.2rem; }
            .cheat-sheet .lead { font-size: 8pt; margin-bottom: 0.3rem; }
            .cheat-grid { display: block; columns: 3; column-gap: 5mm; }
            .cheat-block { break-inside: auto; margin-bottom: 2mm; }
            .cheat-block h3 { font-size: 9pt; margin: 0 0 1mm; break-after: avoid; }
            .cheat-table { font-size: 8pt; }
            .cheat-table td { padding: 0.3mm 0.8mm; }
            .cheat-table tr { break-inside: avoid; }

            .cheat-tl div { padding: 0; }
        }
