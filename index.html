    // ================== SESSION ENGINE ==================
    // One engine for practice quizzes, weak drills, numbers drills, retries and
    // today's review. Items are {id, dir?} refs, materialised one at a time so
    // each appearance gets a fresh option shuffle.
    function beginSession({ mode, title, module, refs, requeue }) {
        state.session = {
            mode, title, module: module || 0, queue: refs.slice(), pos: 0, cur: null,
            answered: false, selected: null, flipped: false, requeue: !!requeue,
            firstSeen: new Set(), attempts: [], missed: [], score: 0, graded: 0, requeued: {}
        };
        loadCurrent();
        state.view = 'session';
        render();
        window.scrollTo({ top: 0, behavior: 'auto' });
    }
    function loadCurrent() {
        const s = state.session;
        s.answered = false; s.selected = null; s.flipped = false; s.cur = null;
        while (s.pos < s.queue.length && !(s.cur = materialize(s.queue[s.pos]))) s.queue.splice(s.pos, 1);
    }
    const refsOf = ids => ids.map(id => ({ id }));

    function drawExamMix(scale) {
        const out = [];
        MODS.forEach(m => {
            const want = Math.round(mixOf(m) * scale);
            const pool = shuffle(QUESTIONS.filter(q => q.module === m));
            out.push(...pool.slice(0, want));
        });
        return out;
    }
    function startQuiz(module) {
        module = validModule(module);
        let qs;
        if (module === 0) qs = shuffle(drawExamMix(0.5));
        else qs = shuffle(QUESTIONS.filter(q => q.module === module)).slice(0, 15);
        beginSession({ mode: 'quiz', title: module ? `${ML[module]} quiz` : 'Mixed quiz', module, refs: refsOf(qs.map(q => q.id)) });
    }
    function startWeakDrill(module) {
        module = validModule(module);
        let weak = weakQuestions(module).slice(0, 20);
        if (!weak.length) {
            // Nothing weak yet: fall back to the lowest-interval seen questions.
            weak = QUESTIONS.filter(q => (!module || q.module === module) && progress.srs[q.id])
                .sort((a, b) => progress.srs[a.id].i - progress.srs[b.id].i).slice(0, 15);
        }
        if (!weak.length) { alert('No weak spots yet. Answer some questions first.'); return; }
        beginSession({ mode: 'weak', title: 'Weak-spot drill', module, refs: refsOf(weak.map(q => q.id)) });
    }
    function retryMissed() {
        if (!state.result) return;
        const ids = state.result.missed.map(m => m.id).filter(id => ITEMS.has(id));
        if (!ids.length) return;
        beginSession({ mode: 'retry', title: 'Retry missed', module: state.result.module, refs: refsOf(shuffle(ids)) });
    }

    // Numbers drill: due first, then weak, then unseen, then the rest.
    function pickNumberFacts(source, module, n) {
        const src = source === 'facts' ? NUMBER_FACTS : source === 'timeline' ? TIMELINE_FACTS : (NUMBER_FACTS.length ? NUMBER_FACTS : TIMELINE_FACTS);
        const pool = src.filter(f => !module || f.module === module);
        const today = todayDay();
        const score = f => {
            const s = progress.srs[f.id], st = progress.numberStats[f.id];
            if (s && s.due <= today) return 0;
            if (st && st.wrong >= st.right && st.wrong > 0) return 1;
            if (!s) return 2;
            return 3;
        };
        const ranked = shuffle(pool.slice()).map(f => ({ f, k: score(f) })).sort((a, b) => a.k - b.k);
        return ranked.slice(0, n).map(x => x.f);
    }
    function startNumbers(source, module) {
        const facts = pickNumberFacts(source, validModule(module), 20);
        if (!facts.length) { alert('No number facts available for that selection.'); return; }
        beginSession({ mode: 'numbers', title: 'Numbers & dates', module: validModule(module), refs: facts.map(f => ({ id: f.id, dir: Math.random() < 0.5 ? 'fwd' : 'rev' })) });
    }

    // Today's review: everything due (oldest first), then new items up to the
    // daily cap. Items graded Again come back a few items later in the session.
    function buildReviewQueue(p, today, newLimit, dueLimit, rng) {
        const due = [];
        ITEMS.forEach((_, id) => { const s = p.srs[id]; if (s && s.due <= today) due.push({ id, due: s.due, i: s.i }); });
        shuffle(due, rng);
        due.sort((a, b) => a.due - b.due);
        const dueRefs = due.slice(0, dueLimit).map(d => ({ id: d.id }));
        const fresh = NEW_ORDER.filter(id => !p.srs[id]).slice(0, Math.max(0, newLimit)).map(id => ({ id }));
        return dueRefs.concat(fresh);
    }
    function startReview(extraNew) {
        if (!confirmLeave()) return;
        const today = todayDay();
        const log = todayLog();
        const newLimit = extraNew ? extraNew : Math.max(0, newPerDay(progress, today) - (log.new || 0));
        const refs = buildReviewQueue(progress, today, newLimit, 150);
        beginSession({ mode: 'review', title: "Today's review", module: 0, refs, requeue: true });
    }

    function sessionSelect(i) {
        const s = state.session;
        if (!s || s.answered || !s.cur || s.cur.kind !== 'mcq') return;
        const it = s.cur;
        if (i < 0 || i >= it.options.length) return;
        s.answered = true;
        s.selected = i;
        const correct = i === it.correct;
        const first = !s.firstSeen.has(it.id);
        if (first) {
            s.firstSeen.add(it.id);
            recordStat(it.id, correct);
            s.attempts.push({ id: it.id, module: it.module, correct });
            if (correct) s.score++;
            else s.missed.push(Object.assign({}, it, { chosen: i }));
        }
        if (!correct) gradeCurrent(1);
        saveProgress();
        render();
    }
    // Grade and schedule the current item (once per appearance).
    function gradeCurrent(grade) {
        const s = state.session;
        if (!s || !s.cur || s.cur.graded) return;
        s.cur.graded = true;
        applyGrade(s.cur.id, grade);
        s.graded++;
        if (grade === 1 && s.requeue) {
            const n = s.requeued[s.cur.id] || 0;
            if (n < 2) {
                s.requeued[s.cur.id] = n + 1;
                const ref = Object.assign({}, s.queue[s.pos]);
                s.queue.splice(Math.min(s.queue.length, s.pos + 4), 0, ref);
            }
        }
    }
    // Advance. For a correctly answered MCQ, `grade` is the confidence rating
    // (2 guessed, 3 knew it, 4 easy); a wrong answer was already graded Again.
    function sessionNext(grade) {
        const s = state.session;
        if (!s || !s.cur) return;
        if (s.cur.kind === 'mcq') {
            if (!s.answered) return;
            if (!s.cur.graded) gradeCurrent(grade || 3);
        } else {
            if (!s.flipped) return;
            if (!s.cur.graded) {
                const g = grade || 3;
                const first = !s.firstSeen.has(s.cur.id);
                if (first) {
                    s.firstSeen.add(s.cur.id);
                    recordStat(s.cur.id, g > 1);
                    s.attempts.push({ id: s.cur.id, module: s.cur.module, correct: g > 1 });
                    if (g > 1) s.score++; else s.missed.push(Object.assign({}, s.cur, { chosen: null }));
                }
                gradeCurrent(g);
            }
        }
        saveProgress();
        s.pos++;
        if (s.pos >= s.queue.length) { finishSession(); return; }
        loadCurrent();
        if (!s.cur) { finishSession(); return; }
        render();
    }
    function sessionFlip() { const s = state.session; if (s && s.cur && s.cur.kind === 'card') { s.flipped = !s.flipped; render(); } }
    function endSession() {
        const s = state.session;
        if (!s) return;
        if (s.mode !== 'review' && (s.pos > 0 || s.answered) && !confirm('End now? Answers so far stay in your stats, but no score is recorded.')) return;
        if (s.mode === 'review' && s.attempts.length) { finishSession(); return; }
        state.session = null;
        showView(s.mode === 'review' ? 'home' : 'practice');
    }
    function finishSession() {
        const s = state.session;
        const r = {
            mode: s.mode, title: s.title, module: s.module, isExam: false,
            score: s.score, total: s.attempts.length, attempts: s.attempts, missed: s.missed,
            timedOut: false, graded: s.graded
        };
        if (['quiz', 'weak', 'retry'].includes(s.mode) && r.total) recordQuizResult(r);
        if (s.mode === 'weak') logDaily('weak');
        if (s.mode === 'numbers') logDaily('num');
        saveProgress();
        state.result = r;
        state.session = null;
        state.view = 'results';
        render();
        window.scrollTo({ top: 0, behavior: 'auto' });
    }

    function renderMnemonic(m) {
        return m ? `<div class="mnemonic"><span class="mnemonic-label">Memory hook</span>${m}</div>` : '';
    }
    function renderReviewEmpty() {
        const unseen = unseenCount(progress);
        const tomorrow = dueCount(progress, todayDay() + 1);
        return `
            <div class="card" style="text-align:center">
                <h2>All caught up</h2>
                <p>Nothing is due and today's new items are done. ${tomorrow ? `${plural(tomorrow, 'item')} will be due tomorrow.` : ''}</p>
                <div class="actions" style="justify-content:center">
                    ${unseen ? `<button class="btn btn-primary" onclick="VE.startReview(10)">Learn 10 more new items</button>` : ''}
                    <button class="btn btn-secondary" onclick="VE.startWeakDrill(0)">Weak-spot drill</button>
                    <button class="btn btn-secondary" onclick="VE.startExam()">Mock exam</button>
                </div>
            </div>`;
    }
    function renderSession() {
        const s = state.session;
        if (!s.queue.length || !s.cur) return renderReviewEmpty();
        const it = s.cur;
        const n = s.queue.length;
        const pct = Math.round(s.pos / n * 100);
        const isNew = !progress.srs[it.id] && !it.graded;
        const head = `
            <div class="quiz-header">
                <span class="module-badge module-${it.module}">${it.module ? `M${it.module} &middot; ${ML[it.module]}` : (it.kind === 'card' ? 'Flashcard' : 'Mixed')}</span>
                <span class="quiz-meta">${esc(s.title)} &middot; ${s.pos + 1} / ${n}${s.mode !== 'review' ? ` &middot; ${s.score} right` : ''}${isNew ? ' &middot; <span style="color:var(--accent-text)">new</span>' : ''}</span>
            </div>
            <div class="progress-bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><div class="progress-fill" style="width:${pct}%"></div></div>`;
        const foot = `<div class="quiz-abandon"><button class="btn-tiny" onclick="VE.endSession()">${s.mode === 'review' ? 'End session' : 'Leave'}</button></div>`;
        if (it.kind === 'card') return `<div class="card">${head}${renderCardBody(it, s.flipped, 'session')}${foot}</div>`;

        const options = it.options.map((opt, i) => {
            let cls = 'quiz-option';
            if (s.answered) {
                if (i === it.correct) cls += ' correct';
                else if (i === s.selected) cls += ' incorrect';
                else cls += ' dim';
            }
            return `<button type="button" class="${cls}" onclick="VE.select(${i})"${s.answered ? ' disabled' : ''}><span class="key-hint">${i + 1}</span><span>${opt}</span></button>`;
        }).join('');
        let after = '';
        if (s.answered) {
            const right = s.selected === it.correct;
            after = `
                <div class="quiz-explanation ${right ? 'is-right' : 'is-wrong'}" role="status"><strong class="${right ? 'verdict-right' : 'verdict-wrong'}">${right ? '&#10003; Correct.' : '&#10007; Not quite.'}</strong> ${it.explanation || ''}</div>
                ${renderMnemonic(it.mnemonic)}
                ${right ? `
                    <div class="confidence">
                        <span class="confidence-label">How sure were you? This sets when you see it again.</span>
                        <div class="confidence-row">
                            <button class="btn btn-secondary btn-sm" onclick="VE.next(2)">Guessed <kbd>G</kbd></button>
                            <button class="btn btn-primary btn-sm" onclick="VE.next(3)" id="next-btn">Knew it <kbd>Enter</kbd></button>
                            <button class="btn btn-secondary btn-sm" onclick="VE.next(4)">Easy <kbd>E</kbd></button>
                        </div>
                    </div>`
                : `<div class="quiz-actions"><button class="btn btn-primary btn-full" onclick="VE.next(1)" id="next-btn">${s.pos + 1 === n ? 'See results' : 'Next'} <kbd>Enter</kbd></button></div>`}`;
        } else {
            after = `<div class="kbd-hint">Press <kbd>1</kbd>&ndash;<kbd>${it.options.length}</kbd> to answer</div>`;
        }
        return `<div class="card">${head}<p class="quiz-question">${it.q}</p><div class="quiz-options">${options}</div>${after}${foot}</div>`;
    }

    // Shared flashcard body. `ctx` is 'session' or 'browse' (the flashcards view).
    function renderCardBody(c, flipped, ctx) {
        const prev = progress.srs[c.id];
        const today = todayDay(), examDay = examDayOf(progress);
        const preview = g => fmtInterval(srsSchedule(prev, g, today, examDay).i);
        const fn = ctx === 'session' ? 'VE.next' : 'VE.flashGrade';
        const flip = ctx === 'session' ? 'VE.flip()' : 'VE.flashFlip()';
        return `
            <div class="flashcard-wrap">
                <button type="button" class="flashcard" onclick="${flip}" aria-label="${flipped ? 'Answer shown. Activate to see the question again.' : 'Activate to reveal the answer.'}">
                    ${flipped ? `<span class="flashcard-q-small">${c.front}</span><span class="flashcard-back">${c.back}</span>` : `<span class="flashcard-front">${c.front}</span>`}
                </button>
            </div>
            ${flipped ? renderMnemonic(c.mnemonic) : ''}
            ${flipped ? `
                <div class="grade-row" role="group" aria-label="How well did you know it?">
                    <button class="btn btn-secondary grade-btn grade-1" onclick="${fn}(1)">Again<span class="grade-int">${preview(1)} &middot; 1</span></button>
                    <button class="btn btn-secondary grade-btn grade-2" onclick="${fn}(2)">Hard<span class="grade-int">${preview(2)} &middot; 2</span></button>
                    <button class="btn btn-primary grade-btn" onclick="${fn}(3)">Good<span class="grade-int">${preview(3)} &middot; 3</span></button>
                    <button class="btn btn-secondary grade-btn" onclick="${fn}(4)">Easy<span class="grade-int">${preview(4)} &middot; 4</span></button>
                </div>
                <div class="kbd-hint"><kbd>1</kbd>&ndash;<kbd>4</kbd> rate &middot; <kbd>J</kbd> again &middot; <kbd>K</kbd> good</div>`
            : `
                <div class="flashcard-controls">
                    ${ctx === 'browse' ? `<button class="btn btn-secondary" onclick="VE.flashPrev()">&larr; Prev</button>` : ''}
                    <button class="btn btn-primary" onclick="${flip}">Reveal <kbd>Space</kbd></button>
                    ${ctx === 'browse' ? `<button class="btn btn-secondary" onclick="VE.flashNext()">Next &rarr;</button>` : ''}
                </div>`}`;
    }

    // ================== MOCK EXAM ==================
    // Mirrors the real test: no feedback until the end, answers can be changed,
    // questions can be flagged, and a review screen comes before submitting.
    let examTimerId = null;
    function startExam() {
        if (!confirmLeave()) return;
        const qs = shuffle(drawExamMix(1));
        const n = qs.length;
        state.exam = {
            qs: qs.map(prepareQuestion), answers: new Array(n).fill(null), flags: new Array(n).fill(false),
            current: 0, deadline: Date.now() + EXAM.durationMinutes * 60000, started: Date.now()
        };
        state.view = 'exam';
        render();
        window.scrollTo({ top: 0, behavior: 'auto' });
        startExamTimer();
    }
    function startExamTimer() {
        clearInterval(examTimerId);
        examTimerId = setInterval(() => {
            if (!state.exam) { stopExamTimer(); return; }
            if (Date.now() >= state.exam.deadline) { submitExam(true); return; }
            const el = document.getElementById('exam-clock');
            if (el) { el.textContent = formatRemaining(); el.classList.toggle('is-urgent', remainingMs() <= 5 * 60000); }
        }, 1000);
    }
    function stopExamTimer() { clearInterval(examTimerId); examTimerId = null; }
    function remainingMs() { return Math.max(0, ((state.exam && state.exam.deadline) || 0) - Date.now()); }
    function formatRemaining() { const t = Math.ceil(remainingMs() / 1000); return `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`; }
    function clockHtml() { return `<span id="exam-clock" class="exam-clock${remainingMs() <= 5 * 60000 ? ' is-urgent' : ''}" role="timer" aria-label="Time remaining">${formatRemaining()}</span>`; }

    function examSelect(i) {
        const ex = state.exam; if (!ex || state.view !== 'exam') return;
        const q = ex.qs[ex.current]; if (i < 0 || i >= q.options.length) return;
        ex.answers[ex.current] = i;
        render();
    }
    function examGo(idx) {
        const ex = state.exam; if (!ex) return;
        ex.current = clamp(idx, 0, ex.qs.length - 1);
        state.view = 'exam';
        render();
        window.scrollTo({ top: 0, behavior: 'auto' });
    }
    function examNext() { const ex = state.exam; if (!ex) return; if (ex.current >= ex.qs.length - 1) examOpenReview(); else examGo(ex.current + 1); }
    function examPrev() { const ex = state.exam; if (ex && ex.current > 0) examGo(ex.current - 1); }
    function examToggleFlag() { const ex = state.exam; if (!ex) return; ex.flags[ex.current] = !ex.flags[ex.current]; render(); }
    function examOpenReview() { if (!state.exam) return; state.view = 'examReview'; render(); window.scrollTo({ top: 0, behavior: 'auto' }); }

    function renderExamGrid() {
        const ex = state.exam;
        return `
            <div class="qgrid" role="group" aria-label="Question navigator">
                ${ex.qs.map((q, i) => {
                    const cls = ['qcell', ex.answers[i] !== null ? 'is-answered' : '', ex.flags[i] ? 'is-flagged' : '', (i === ex.current && state.view === 'exam') ? 'is-current' : ''].join(' ');
                    const label = `Question ${i + 1}${ex.answers[i] !== null ? ', answered' : ', not answered'}${ex.flags[i] ? ', flagged' : ''}`;
                    return `<button class="${cls}" onclick="VE.examGo(${i})" aria-label="${label}">${i + 1}</button>`;
                }).join('')}
            </div>
            <div class="qgrid-legend"><span class="lg-ans">Answered</span><span>Not answered</span><span class="lg-flag">Flagged</span></div>`;
    }
    function renderExam() {
        const ex = state.exam;
        const q = ex.qs[ex.current];
        const n = ex.qs.length;
        const answeredN = ex.answers.filter(a => a !== null).length;
        const flagged = ex.flags[ex.current];
        const chosen = ex.answers[ex.current];
        return `
            <div class="card">
                <div class="quiz-header is-timed">
                    <span class="module-badge module-${q.module}">M${q.module} &middot; ${ML[q.module]}</span>
                    <span class="quiz-meta">${clockHtml()} &middot; Q ${ex.current + 1}/${n} &middot; ${answeredN} answered</span>
                </div>
                <p class="quiz-question" style="margin-top:0.4rem">${q.q}</p>
                <div class="quiz-options" role="radiogroup" aria-label="Answer options">
                    ${q.options.map((opt, i) => `<button type="button" role="radio" aria-checked="${chosen === i}" class="quiz-option${chosen === i ? ' selected' : ''}" onclick="VE.examSelect(${i})"><span class="key-hint">${i + 1}</span><span>${opt}</span></button>`).join('')}
                </div>
                <div class="exam-controls">
                    <button class="btn btn-secondary" onclick="VE.examPrev()"${ex.current === 0 ? ' disabled' : ''}>&larr; Prev</button>
                    <button class="btn btn-flag${flagged ? ' is-flagged' : ''}" onclick="VE.examToggleFlag()" aria-pressed="${flagged}">&#9873; ${flagged ? 'Flagged' : 'Flag'}</button>
                    ${ex.current < n - 1 ? `<button class="btn btn-primary" onclick="VE.examNext()">Next &rarr;</button>` : `<button class="btn btn-primary" onclick="VE.examOpenReview()">Review</button>`}
                </div>
                <div class="section-label" style="margin-top:1.2rem">Navigator</div>
                ${renderExamGrid()}
                <div class="kbd-hint"><kbd>1</kbd>&ndash;<kbd>4</kbd> answer &middot; <kbd>&larr;</kbd> <kbd>&rarr;</kbd> move &middot; <kbd>F</kbd> flag &middot; <kbd>R</kbd> review</div>
                <div class="quiz-abandon">
                    <button class="btn-tiny" onclick="VE.examOpenReview()">Review &amp; submit</button>
                    <button class="btn-tiny btn-tiny-danger" onclick="VE.showView('practice')">Discard exam</button>
                </div>
            </div>`;
    }
    function renderExamReview() {
        const ex = state.exam;
        const n = ex.qs.length;
        const unanswered = [], flaggedList = [];
        ex.qs.forEach((q, i) => { if (ex.answers[i] === null) unanswered.push(i); if (ex.flags[i]) flaggedList.push(i); });
        const jump = list => `<div class="jump-list">${list.map(i => `<button class="qcell${ex.answers[i] !== null ? ' is-answered' : ''}${ex.flags[i] ? ' is-flagged' : ''}" style="width:42px" onclick="VE.examGo(${i})" aria-label="Go to question ${i + 1}">${i + 1}</button>`).join('')}</div>`;
        return `
            <div class="card">
                <div class="quiz-header is-timed">
                    <span class="module-badge module-0">Review before submitting</span>
                    <span class="quiz-meta">${clockHtml()} left</span>
                </div>
                <div class="exam-summary">
                    <div class="stat-pill"><span class="num">${n - unanswered.length}</span><span class="lbl">Answered</span></div>
                    <div class="stat-pill"><span class="num" style="${unanswered.length ? 'color:var(--error)' : ''}">${unanswered.length}</span><span class="lbl">Blank</span></div>
                    <div class="stat-pill"><span class="num" style="${flaggedList.length ? 'color:var(--warn)' : ''}">${flaggedList.length}</span><span class="lbl">Flagged</span></div>
                </div>
                ${unanswered.length ? `<h3>Not answered</h3>${jump(unanswered)}` : ''}
                ${flaggedList.length ? `<h3>Flagged for review</h3>${jump(flaggedList)}` : ''}
                <div class="hint-box">${unanswered.length
                    ? `<strong>Never leave a blank.</strong> A blank scores zero; a guess is right one time in four, more if you can rule out one option.`
                    : flaggedList.length ? `Revisit flagged questions, but only change an answer if you find a concrete reason. First instincts are usually right.` : `Everything answered. Submit when ready, or use the spare time to re-read the question stems.`}</div>
                <div class="section-label">All questions</div>
                ${renderExamGrid()}
                <div class="actions">
                    <button class="btn btn-secondary" onclick="VE.examGo(${unanswered.length ? unanswered[0] : (flaggedList.length ? flaggedList[0] : 0)})">&larr; Back to questions</button>
                    <button class="btn btn-primary" onclick="VE.submitExam(false)">Submit exam</button>
                </div>
            </div>`;
    }
    function submitExam(timedOut) {
        const ex = state.exam;
        if (!ex) return;
        if (!timedOut) {
            const blanks = ex.answers.filter(a => a === null).length;
            if (blanks && !confirm(`${plural(blanks, 'question is', 'questions are')} unanswered and will score zero. Submit anyway?`)) return;
        }
        stopExamTimer();
        const attempts = [], missed = [];
        let score = 0, flaggedRight = 0, flaggedTotal = 0;
        ex.qs.forEach((q, i) => {
            const a = ex.answers[i];
            const correct = a === q.correct;
            attempts.push({ id: q.id, module: q.module, correct });
            if (correct) score++; else missed.push(Object.assign({}, q, { chosen: a }));
            if (ex.flags[i]) { flaggedTotal++; if (correct) flaggedRight++; }
            if (a !== null) {
                recordStat(q.id, correct);
                // Right but flagged means unsure: schedule it like a guess.
                applyGrade(q.id, !correct ? 1 : ex.flags[i] ? 2 : 3);
            }
        });
        const r = {
            mode: 'exam', title: 'Mock exam', module: 0, isExam: true, score, total: ex.qs.length, attempts, missed,
            timedOut: !!timedOut, answeredCount: ex.answers.filter(a => a !== null).length,
            flaggedRight, flaggedTotal, usedMs: Math.min(Date.now(), ex.deadline) - ex.started
        };
        recordQuizResult(r);
        logDaily('mock');
        saveProgress();
        state.exam = null;
        state.result = r;
        state.view = 'results';
        render();
        window.scrollTo({ top: 0, behavior: 'auto' });
    }

    // ================== RESULTS ==================
    function renderResults() {
        const r = state.result;
        const pct = r.total ? Math.round(r.score / r.total * 100) : 0;
        const passed = pct >= EXAM.passPct;
        const isReview = r.mode === 'review';
        const byModule = MODS.map(m => {
            const rows = r.attempts.filter(a => a.module === m);
            if (!rows.length) return null;
            const right = rows.filter(a => a.correct).length;
            return { m, total: rows.length, right, pct: Math.round(right / rows.length * 100) };
        }).filter(Boolean);
        const today = todayDay();
        const mins = r.usedMs ? `${Math.floor(r.usedMs / 60000)}:${String(Math.floor(r.usedMs / 1000) % 60).padStart(2, '0')}` : '';
        const again = r.mode === 'exam' ? 'VE.startExam()' : r.mode === 'numbers' ? "VE.showView('numbers')" : r.mode === 'review' ? 'VE.startReview()' : r.mode === 'weak' ? `VE.startWeakDrill(${r.module})` : `VE.startQuiz(${r.module})`;
        return `
            <div class="card score-card">
                <h2 style="font-size:1.2rem;margin-bottom:0.7rem">${esc(r.isExam ? 'Mock exam results' : isReview ? 'Review complete' : r.title + ' results')}</h2>
                ${r.timedOut ? `<div class="timeout-banner">&#9201; Time ran out with ${r.answeredCount} of ${r.total} answered. Unanswered questions count as wrong, exactly as on the real exam.</div>` : ''}
                ${r.total ? `
                    <div class="score-num ${isReview ? '' : passed ? 'is-pass-text' : 'is-fail-text'}">${pct}%</div>
                    <div class="score-label">${r.score} / ${r.total} ${isReview ? 'right first time' : 'correct'}${r.isExam ? ` (need ${EXAM.passMark} of ${EXAM.questionsOnExam})` : ''}</div>
                    ${isReview ? '' : `<div class="score-verdict ${passed ? 'is-pass-text' : 'is-fail-text'}">${passed ? '&#10003; ' + (r.isExam ? 'PASS' : 'Above the pass line') : '&#10007; ' + (r.isExam ? 'FAIL: needs more study' : 'Below the pass line')}</div>
                    <div class="score-note">Pass line: ${EXAM.passPct}%${mins ? ` &middot; time used ${mins}` : ''}</div>`}
                ` : `<p>No items answered.</p>`}
                ${isReview ? `<div class="score-note">${plural(dueCount(progress, today), 'item')} still due today &middot; ${plural(dueCount(progress, today + 1), 'item')} due by tomorrow</div>` : ''}
                ${r.isExam && r.flaggedTotal ? `<div class="score-note">Flagged ${r.flaggedTotal}: ${r.flaggedRight} of them right.</div>` : ''}
            </div>
            ${byModule.length > 1 ? `
                <div class="section-label">${r.isExam ? 'Where you lost marks' : 'By module'}</div>
                <div class="card">
                    ${byModule.map(b => `
                        <div class="mod-bar-row">
                            <span class="mod-bar-label"><span class="module-badge module-${b.m}">M${b.m}</span> ${ML[b.m]}</span>
                            <div class="mod-bar"><div class="mod-bar-fill mod-fill-${b.m}" style="width:${b.pct}%"></div></div>
                            <span class="mod-bar-val">${b.right}/${b.total}</span>
                        </div>`).join('')}
                </div>` : ''}
            ${r.missed.length ? `
                <div class="section-label">Review the ${r.missed.length} you missed</div>
                <div class="card">
                    ${r.missed.map(q => `
                        <details class="missed-item">
                            <summary><span class="module-badge module-${q.module}">M${q.module || '?'}</span><span class="missed-q">${q.kind === 'card' ? q.front : q.q}</span></summary>
                            <div class="missed-body">
                                ${q.kind === 'card'
                                    ? `<div class="missed-line missed-right">${q.back}</div>`
                                    : `<div class="missed-line missed-yours">Your answer: ${q.chosen !== null && q.chosen !== undefined ? q.options[q.chosen] : '<em>not answered</em>'}</div>
                                       <div class="missed-line missed-right">Correct: ${q.options[q.correct]}</div>
                                       <p class="missed-why">${q.explanation || ''}</p>`}
                                ${renderMnemonic(q.mnemonic)}
                            </div>
                        </details>`).join('')}
                </div>` : (r.total ? `<div class="card" style="text-align:center"><p style="color:var(--success);font-weight:700">Nothing missed. Clean run.</p></div>` : '')}
            <div class="quiz-actions" style="justify-content:center;margin-top:1.1rem">
                <button class="btn btn-secondary" onclick="VE.showView('${isReview ? 'home' : 'practice'}')">${isReview ? 'Home' : 'Back to practice'}</button>
                ${r.missed.length && r.missed.some(m => m.kind === 'mcq') ? `<button class="btn btn-secondary" onclick="VE.retryMissed()">Retry these ${r.missed.length}</button>` : ''}
                <button class="btn btn-primary" onclick="${again}">${r.isExam ? 'New mock exam' : isReview ? 'Continue reviewing' : 'Go again'}</button>
            </div>
        `;
    }

    // ================== FLASHCARDS (browse) ==================
    function buildFlashDeck(prioritizeWrong) {
        const deck = FLASHCARDS.slice();
        if (prioritizeWrong) {
            const w = c => { const s = progress.flashStats[c.id] || { right: 0, wrong: 0 }; return s.wrong - s.right; };
            return deck.filter(c => w(c) > 0).sort((a, b) => w(b) - w(a));
        }
        return shuffle(deck);
    }
    function startFlashcards(prioritizeWrong) {
        const deck = buildFlashDeck(prioritizeWrong);
        state.flash = { current: 0, flipped: false, deck: deck.length ? deck : buildFlashDeck(false), prioritized: !!prioritizeWrong && deck.length > 0 };
        showView('flashcards');
    }
    function renderFlashcards() {
        if (!state.flash.deck.length) state.flash = { current: 0, flipped: false, deck: buildFlashDeck(false), prioritized: false };

        return `

    function flashFlip() { state.flash.flipped = !state.flash.flipped; render(); }
    function flashNext() { const f = state.flash; f.current = (f.current + 1) % f.deck.length; f.flipped = false; render(); }
    function flashPrev() { const f = state.flash; f.current = (f.current - 1 + f.deck.length) % f.deck.length; f.flipped = false; render(); }
    function flashShuffle() { shuffle(state.flash.deck); state.flash.current = 0; state.flash.flipped = false; render(); }
    function flashGrade(g) {
        const card = state.flash.deck[state.flash.current];
        if (!card || !state.flash.flipped) return;
        recordStat(card.id, g > 1);
        applyGrade(card.id, g);
        saveProgress();
        flashNext();

    // ================== REFERENCE ==================
    // Browser Ctrl+F cannot see inside a closed <details>, hence the filter box.
    function refSearchInput(e) {
        state.refQuery = e.target.value;
        const box = document.getElementById('ref-results');
        if (box) box.innerHTML = renderRefSections();

    function clearRefSearch() {
        state.refQuery = '';
        render();
        const input = document.getElementById('ref-search-input');
        if (input) input.focus();
    }
    function refMatches(q) {
        const needle = String(q || '').trim().toLowerCase();
        if (!needle) return null;
        const out = [];
        MODULE_KEYS.forEach(key => {
            STUDY[key].sections.forEach((s, i) => {
                const plain = String(s.content).replace(/<[^>]+>/g, ' ').toLowerCase();
                if (String(s.title).toLowerCase().includes(needle) || plain.includes(needle)) out.push({ key, i });
            });
        });
        return out;
    }
    function refCountLabel() {
        const hits = refMatches(state.refQuery);
        if (!hits) return '';
        return hits.length ? `${hits.length} section${hits.length === 1 ? '' : 's'} match` : 'No sections match. Try a shorter term.';
    }
    // Wrap matches in <mark>, never inside a tag or an HTML entity. The inserted
    // text is always the document's own matched text, never the raw query.
    function highlightQuery(html, needle) {
        needle = String(needle || '').trim();
        if (!needle) return html;
        const safe = needle.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        try {
            return String(html).replace(new RegExp(`(?<!&[#a-zA-Z0-9]*)(${safe})(?![^<]*>)`, 'gi'), '<mark>$1</mark>');
        } catch (e) {
            return String(html).replace(new RegExp(`(${safe})(?![^<]*>)`, 'gi'), '<mark>$1</mark>');
        }
    }
    function toggleSection(key, i, btn) {
        const k = key + ':' + i;
        if (progress.sectionsRead[k]) delete progress.sectionsRead[k];
        else { progress.sectionsRead[k] = true; logDaily('read'); }
        saveProgress();
        const done = !!progress.sectionsRead[k];
        if (btn) {
            btn.textContent = done ? '✓ Studied (undo)' : 'Mark as studied';
            btn.setAttribute('aria-pressed', String(done));
            const tick = document.getElementById('tick-' + key + '-' + i);
            if (tick) tick.textContent = done ? '✓' : '';
        } else render();
        buildNav();
    }
    function renderRefSections() {
        const q = state.refQuery || '';
        const hits = refMatches(q);
        const isHit = (key, i) => !hits || hits.some(h => h.key === key && h.i === i);
        let html = '';
        MODULE_KEYS.forEach(key => {
            const m = STUDY[key];
            const visible = m.sections.map((s, i) => ({ s, i })).filter(({ i }) => isHit(key, i));
            if (!visible.length) return;
            const studied = m.sections.filter((s, i) => progress.sectionsRead[key + ':' + i]).length;
            html += `<article class="card">
                <div class="module-header">
                    <span class="module-badge ${esc(m.badge || key.replace('module', 'module-'))}">${key.replace('module', 'Module ')}</span>
                    <span class="ref-sec-count">${hits ? `${visible.length} of ${m.sections.length} sections` : `${studied}/${m.sections.length} studied`}</span>
                </div>
                <h2>${m.title}</h2>
                ${visible.map(({ s, i }) => {
                    const done = !!progress.sectionsRead[key + ':' + i];
                    const open = hits || state.refOpen === key + ':' + i;
                    return `
                    <details class="study-section" id="sec-${key}-${i}"${open ? ' open' : ''}>
                        <summary><span class="sec-title"><span class="sec-tick" id="tick-${key}-${i}" aria-hidden="true">${done ? '&#10003;' : ''}</span>${highlightQuery(s.title, q)}</span></summary>
                        <div class="content">${highlightQuery(s.content, q)}
                            <div class="sec-foot"><button class="btn-tiny" aria-pressed="${done}" onclick="VE.toggleSection('${key}', ${i}, this)">${done ? '&#10003; Studied (undo)' : 'Mark as studied'}</button></div>
                        </div>
                    </details>`;
                }).join('')}
            </article>`;
        });
        return html || `<div class="card" style="text-align:center"><p>Nothing found for &ldquo;${esc(q)}&rdquo;.</p></div>`;
    }

        const q = state.refQuery || '';

        const id = newProfileId();
        profiles.list.push({ id, name: clean, created: Date.now() });

        if (confirm(`Profile "${clean}" created. Switch to it now?`)) switchProfile(id); else render();

        const p = profiles.list.find(x => x.id === id);

    function deleteProfile(id) {
        const p = profiles.list.find(x => x.id === id);
        if (!p) return;
        if (!confirm(`Delete profile "${p.name}" and all its progress? This cannot be undone. Export a backup first if unsure.`)) return;
        if (id === profiles.active && !confirmLeave()) return;
        STORE.remove(PROGRESS_PREFIX + id);
        profiles.list = profiles.list.filter(x => x.id !== id);
        if (!profiles.list.length) {
            const nid = newProfileId();
            profiles.list.push({ id: nid, name: 'Profile 1', created: Date.now() });
        }
        if (id === profiles.active) {
            profiles.active = profiles.list[0].id;
            progress = loadProgressFor(STORE, profiles.active, todayDay());
            state.session = null; state.exam = null; state.result = null;
        }
        saveProfiles();
        render();
    }

    // ================== EXPORT / IMPORT / RESET ==================
    function exportProgress() {
        const prof = activeProfile();
        const payload = { app: 'vivre-ensemble', schema: PROGRESS_VERSION, exportedAt: new Date().toISOString(), profileName: prof.name, progress };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        const slug = prof.name.toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 30) || 'profile';
        a.href = url;
        a.download = `vivre-ensemble-${slug}-${new Date().toISOString().slice(0, 10)}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
    }
    // Merge: sums for counters, union for read flags, the most recently
    // reviewed schedule per item, max per day in the activity log.
    function mergeProgress(cur, inc) {
        const out = normalizeProgress(JSON.parse(JSON.stringify(cur)));
        ['chaptersRead', 'scenariosSeen', 'sectionsRead'].forEach(k => { out[k] = Object.assign({}, out[k], inc[k]); });
        ['flashStats', 'questionStats', 'numberStats'].forEach(k => {
            Object.entries(inc[k] || {}).forEach(([id, v]) => {
                const c = out[k][id] || { right: 0, wrong: 0 };
                out[k][id] = { right: c.right + v.right, wrong: c.wrong + v.wrong };
            });
        });
        const seenTs = new Set(out.quizAttempts.map(a => a.ts + ':' + a.score));
        out.quizAttempts = out.quizAttempts.concat(inc.quizAttempts.filter(a => !seenTs.has(a.ts + ':' + a.score)))
            .sort((a, b) => a.ts - b.ts).slice(-60);
        [0, 1, 2, 3].forEach(k => { out.bestByModule[k] = Math.max(out.bestByModule[k] || 0, inc.bestByModule[k] || 0); });
        if (inc.bestExam && (!out.bestExam || inc.bestExam.pct > out.bestExam.pct)) out.bestExam = inc.bestExam;
        Object.entries(inc.srs).forEach(([id, s]) => {
            const c = out.srs[id];
            if (!c || s.last > c.last || (s.last === c.last && s.due > c.due)) out.srs[id] = s;
        });
        Object.entries(inc.daily).forEach(([day, d]) => {
            const c = out.daily[day] || {};
            DAILY_FIELDS.forEach(f => { const v = Math.max(c[f] || 0, d[f] || 0); if (v) c[f] = v; });
            out.daily[day] = c;
        });
        if (!out.settings.examDate && inc.settings.examDate) out.settings.examDate = inc.settings.examDate;
        out.planCache = null;
        return out;
    }
    function importProgress() {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'application/json,.json';
        input.onchange = (e) => {
            const file = e.target.files && e.target.files[0];
            if (!file) return;
            if (file.size > 5 * 1024 * 1024) { alert('That file is too large to be a progress backup.'); return; }
            const reader = new FileReader();
            reader.onload = () => {
                try {
                    const payload = JSON.parse(reader.result);
                    const raw = isObj(payload) && isObj(payload.progress) ? payload.progress : payload;
                    if (!isObj(raw)) throw new Error('Invalid file');
                    const v = Number(raw.version);
                    if (![1, 2, 3].includes(v)) throw new Error('Unsupported file version');
                    const incoming = migrateProgress(raw, todayDay());
                    const name = activeProfile().name;
                    const doMerge = confirm(`Import into profile "${name}".\n\nOK = Merge with existing progress\nCancel = Replace this profile's progress`);
                    if (!doMerge && !confirm(`Replace ALL progress in "${name}" with the file? This cannot be undone.`)) return;
                    progress = doMerge ? mergeProgress(progress, incoming) : incoming;
                    saveProgress();
                    render();
                    alert('Progress imported.');
                } catch (err) {
                    alert('Could not read that file: ' + err.message);
                }
            };
            reader.readAsText(file);
        };
        input.click();
    }
    function resetProgress() {
        const name = activeProfile().name;
        if (!confirm(`Reset all progress for "${name}"? This clears reading, quiz history, the review schedule and the plan. Other profiles are not affected.`)) return;
        progress = emptyProgress();
        saveProgress();
        render();
    }
    function markChapterRead(chId) {
        progress.chaptersRead[chId] = true;
        logDaily('read');
        saveProgress();
        render();
    }

    // ================== KEYBOARD ==================
    document.addEventListener('keydown', e => {
        const tag = e.target && e.target.tagName;
        if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
        if (e.ctrlKey || e.metaKey || e.altKey) return;
        const k = e.key;
        // Space/Enter on a focused button is the browser's job.
        const onButton = tag === 'BUTTON' || tag === 'SUMMARY';
        if ((k === ' ' || k === 'Enter') && onButton) return;
        const v = state.view;

        if (v === 'session' && state.session && state.session.cur) {
            const s = state.session, it = s.cur;
            if (it.kind === 'mcq') {
                if (!s.answered) { const n = parseInt(k, 10); if (n >= 1 && n <= it.options.length) sessionSelect(n - 1); return; }
                const right = s.selected === it.correct;
                if (k === 'Enter' || k === ' ' || k === 'n') { e.preventDefault(); sessionNext(right ? 3 : 1); }
                else if (right && (k === 'g' || k === 'G')) sessionNext(2);
                else if (right && (k === 'e' || k === 'E')) sessionNext(4);
                return;
            }
            if (!s.flipped) { if (k === ' ' || k === 'Enter') { e.preventDefault(); sessionFlip(); } return; }
            if (['1', '2', '3', '4'].includes(k)) sessionNext(Number(k));
            else if (k === 'j' || k === 'J') sessionNext(1);
            else if (k === 'k' || k === 'K') sessionNext(3);
            else if (k === ' ') { e.preventDefault(); sessionFlip(); }
            return;
        }
        if (v === 'exam' && state.exam) {
            const n = parseInt(k, 10);
            if (n >= 1 && n <= 4) examSelect(n - 1);
            else if (k === 'ArrowRight' || k === 'Enter') { e.preventDefault(); examNext(); }
            else if (k === 'ArrowLeft') examPrev();
            else if (k === 'f' || k === 'F') examToggleFlag();
            else if (k === 'r' || k === 'R') examOpenReview();
            return;
        }
        if (v === 'examReview') return;
        if (v === 'flashcards') {
            if (!state.flash.flipped) {
                if (k === ' ' || k === 'Enter') { e.preventDefault(); flashFlip(); }
            } else {
                if (['1', '2', '3', '4'].includes(k)) { flashGrade(Number(k)); return; }
                if (k === 'j' || k === 'J') { flashGrade(1); return; }
                if (k === 'k' || k === 'K') { flashGrade(3); return; }
                if (k === ' ') { e.preventDefault(); flashFlip(); }
            }
            if (k === 'ArrowRight' || k === 'l') flashNext();
            if (k === 'ArrowLeft' || k === 'h') flashPrev();
            if (k === 's' || k === 'S') flashShuffle();
            return;
        }
        const nav = NAV.find(n => n.key === k && !n.hidden);
        if (nav) { if (nav.view === 'session') startReview(); else showView(nav.view); }
    });

    // Closing the tab mid-quiz or mid-exam loses the attempt.
    window.addEventListener('beforeunload', e => {
        if (inFlight()) { e.preventDefault(); e.returnValue = ''; }
    });

    // ================== PUBLIC API ==================
    window.VE = {
        showView, startReview, startQuiz, startExam, startWeakDrill, startFlashcards, startNumbers, retryMissed,
        select: sessionSelect, next: sessionNext, flip: sessionFlip, endSession,
        flashFlip, flashNext, flashPrev, flashGrade,
        examSelect, examGo, examNext, examPrev, examToggleFlag, examOpenReview, submitExam,
        markChapterRead, toggleSection, refSearchInput, clearRefSearch, openUnit,
        setExamDate, setDailyNew, printPage,
        switchProfile, createProfile, renameProfile, deleteProfile,
        exportProgress, importProgress, resetProgress,
        // Pure helpers, exposed for testing only.
        _test: {
            esc, contentId, srsSchedule, recallProb, passProbability, buildPlan, computeStreak, spreadOrder,
            migrateProgress, normalizeProgress, mergeProgress, loadProfiles, loadProgressFor, makeStore, memoryStorage,
            buildNumberQuestion, firstNumber, numericNeighbours, buildReviewQueue, estimateReadiness, highlightQuery,
            isoToDay, dayToISO, PLAN_UNITS, ITEMS, NUMBER_FACTS, TIMELINE_FACTS, EXAM, emptyProgress,
            keys: { LEGACY_KEY, PROFILES_KEY, PROGRESS_PREFIX },
            getState: () => state, getProgress: () => progress, getProfiles: () => profiles
        }
    };

    // ================== INIT ==================
    render();
    })();
    </script>
</body>
