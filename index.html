                <div style="margin-top:0.8rem"><span class="module-badge module-${s.module}">Module ${s.module}</span></div>
            </article>

            <div class="card">
                ${s.beats.map(b => `
                    <div class="beat">
                        <div class="beat-q">${b.q}</div>
                        <div class="beat-a">${b.a}</div>
                    </div>
                `).join('')}
            </div>

            ${(function() {
                const rel = (s.relatedChapters || []).map(id => chapters.find(c => c.id === id)).filter(Boolean);
                if (!rel.length) return '';
                return `
                    <div class="section-label">Historical context</div>
                    <div class="card"><p style="font-size:0.87rem;color:var(--text-secondary);margin-bottom:0.75rem">Where this scenario fits in the story.</p>
                        ${rel.map(c => `
                            <button class="link-row" onclick="showView('chapter','${c.id}')">
                                <span class="link-icon">📖</span>
                                <span class="link-body"><span class="link-title">Chapter ${c.number}: ${c.title}</span><span class="link-sub">${c.era}</span></span>
                                <span class="link-arrow">&rsaquo;</span>
                            </button>
                        `).join('')}
                    </div>
                `;
            })()}

            <div class="quiz-actions" style="margin-top:1.2rem">
                <button class="btn btn-secondary" onclick="showView('scenarios')">More scenarios</button>
                <button class="btn btn-primary" onclick="startQuiz(${s.links.questionsModule})">Test yourself &rarr;</button>
            </div>
        `;
    }

    // ================== PRACTICE HUB ==================
    function renderPractice() {
        const wrongCount = Object.values(progress.flashStats).filter(s => s.wrong > s.right).length;
        const weakQs = weakQuestions(0);
        return `
            <div class="section-label">Practice</div>
            <div class="practice-hub">
                <button class="practice-tile" onclick="showView('quiz')"><span class="p-icon">🎓</span><span class="p-title">Quiz</span><span class="p-desc">Practice by module</span></button>
                <button class="practice-tile" onclick="startFlashcards(false)"><span class="p-icon">🃏</span><span class="p-title">Flashcards</span><span class="p-desc">${flashcards.length} cards, shuffled</span></button>
                <button class="practice-tile" onclick="showView('timeline')"><span class="p-icon">🕰️</span><span class="p-title">Timeline</span><span class="p-desc">${timeline.length} dates</span></button>
                <button class="practice-tile" onclick="startExam()"><span class="p-icon">🏆</span><span class="p-title">Mock Exam</span><span class="p-desc">40 Qs, full sim</span></button>
            </div>
            ${(weakQs.length || wrongCount) ? `
                <div class="section-label">Review your weak spots</div>
                <div class="review-stack">
                    ${weakQs.length ? `
                        <button class="practice-tile" onclick="startWeakDrill(0)">
                            <span class="p-icon">🩹</span>
                            <span class="p-title">Drill ${Math.min(weakQs.length, 20)} weak question${weakQs.length === 1 ? '' : 's'}</span>
                            <span class="p-desc">Questions you've gotten wrong at least as often as right — weakest first. This is the fastest way to move your score.</span>
                        </button>
                    ` : ''}
                    ${wrongCount ? `
                        <button class="practice-tile" onclick="startFlashcards(true)">
                            <span class="p-icon">🎯</span>
                            <span class="p-title">Review ${wrongCount} weak card${wrongCount === 1 ? '' : 's'}</span>
                            <span class="p-desc">Flashcards you've gotten wrong more than right — sorted by weakness first</span>
                        </button>
                    ` : ''}
                </div>
            ` : ''}
            <div class="section-label">How the real exam works</div>
            <div class="card">
                <ul>
                    <li><strong>${meta.exam.questionsOnExam} multiple-choice questions</strong> in ${meta.exam.durationMinutes} minutes</li>
                    <li>Mix: ${meta.exam.mix.module1} Rights + ${meta.exam.mix.module2} Institutions + ${meta.exam.mix.module3} History</li>
                    <li>Pass mark: <strong>${meta.exam.passMark}/${meta.exam.questionsOnExam} (${meta.exam.passPct}%)</strong></li>
                    <li>Computer-based at <strong>${meta.exam.venue}</strong></li>
                    <li>Cost: <strong>${meta.exam.cost}</strong></li>
                </ul>
            </div>
        `;
    }

    function renderQuizSetup() {
        const m1 = questions.filter(q => q.module === 1).length;
        const m2 = questions.filter(q => q.module === 2).length;
        const m3 = questions.filter(q => q.module === 3).length;
        return `
            <button class="btn-back" onclick="showView('practice')">&larr; Practice</button>
            <div class="card">
                <h2>Practice Quiz</h2>
                <p style="color:var(--text-secondary);font-size:0.9rem;margin-bottom:0.9rem">Pick a module or mix them all.</p>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.6rem;margin-bottom:0.8rem">
                    <button class="btn btn-primary" onclick="startQuiz(0)">All modules · 20 Qs</button>
                    <button class="btn btn-secondary" onclick="startQuiz(1)">Rights (${m1})</button>
                    <button class="btn btn-secondary" onclick="startQuiz(2)">Institutions (${m2})</button>
                    <button class="btn btn-secondary" onclick="startQuiz(3)">History (${m3})</button>
                </div>
                <div class="kbd-hint">Use <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> <kbd>4</kbd> to answer · <kbd>Enter</kbd> to advance</div>
            </div>
        `;
    }

    // Answer position in the source data is heavily skewed (62% of questions have
    // the correct answer second). Presenting options in fixed order teaches the
    // position instead of the fact, so every drawn question gets its own shuffle.
    function prepareQuestion(q) {
        const order = q.options.map((text, i) => ({ text, isCorrect: i === q.correct }));
        shuffle(order);
        return {
            id: q.id,
            module: q.module,
            q: q.q,
            explanation: q.explanation,
            options: order.map(o => o.text),
            correct: order.findIndex(o => o.isCorrect)
        };
    }

    function beginQuiz({ pool, module, isExam, durationMinutes }) {
        state.quiz = {
            qs: pool.map(prepareQuestion),
            current: 0, score: 0, answered: false, selected: null,
            isExam: !!isExam, module, missed: [], answeredCount: 0,
            deadline: durationMinutes ? Date.now() + durationMinutes * 60000 : null,
            timedOut: false
        };
        state.view = 'quizActive';
        updateNav(); render();
        if (state.quiz.deadline) startExamTimer();
    }

    function startQuiz(module) {
        let qs = module === 0 ? [...questions] : questions.filter(q => q.module === module);
        shuffle(qs);
        // Module 0 mirrors the real exam's 10/20/10 weighting rather than drawing
        // uniformly from a pool that is 50% History.
        if (module === 0) {
            qs = drawExamMix(20 / meta.exam.questionsOnExam);
            shuffle(qs);
        } else {
            qs = qs.slice(0, Math.min(15, qs.length));
        }
        beginQuiz({ pool: qs, module, isExam: false });
    }

    // Draw questions in the exam's module proportions. `scale` of 1 = full exam.
    function drawExamMix(scale) {
        const out = [];
        [1, 2, 3].forEach(m => {
            const want = Math.round(meta.exam.mix['module' + m] * scale);
            const pool = questions.filter(q => q.module === m);
            shuffle(pool);
            out.push(...pool.slice(0, want));
        });
        return out;
    }

    function startExam() {
        const qs = drawExamMix(1);
        shuffle(qs);
        beginQuiz({ pool: qs, module: 0, isExam: true, durationMinutes: meta.exam.durationMinutes });
    }

    // Drill only the questions you keep getting wrong — the single highest-value
    // study mode once you have a few quizzes of history.
    function startWeakDrill(module) {
        const weak = weakQuestions(module).slice(0, 20);
        if (!weak.length) return;
        beginQuiz({ pool: weak, module: module || 0, isExam: false });
    }

    function shuffle(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
    }

    // ================== EXAM TIMER ==================
    let examTimerId = null;
    function startExamTimer() {
        clearInterval(examTimerId);
        examTimerId = setInterval(() => {
            if (state.view !== 'quizActive' || !state.quiz.deadline) { stopExamTimer(); return; }
            if (Date.now() >= state.quiz.deadline) {
                stopExamTimer();
                state.quiz.timedOut = true;
                // Questions never reached count as wrong, as on the real exam — push
                // them into `missed` so the breakdown and review list include them.
                const { qs, current, answered } = state.quiz;
                const done = current + (answered ? 1 : 0);
                state.quiz.answeredCount = done;
                for (let i = done; i < qs.length; i++) {
                    state.quiz.missed.push({ ...qs[i], chosen: null });
                }
                finishQuiz();
                return;
            }
            const el = document.getElementById('exam-clock');
            if (el) {
                el.textContent = formatRemaining();
                el.classList.toggle('is-urgent', remainingMs() <= 5 * 60000);
            }
        }, 1000);
    }
    function stopExamTimer() { clearInterval(examTimerId); examTimerId = null; }
    function remainingMs() { return Math.max(0, (state.quiz.deadline || 0) - Date.now()); }
    function formatRemaining() {
        const total = Math.ceil(remainingMs() / 1000);
        return `${Math.floor(total / 60)}:${String(total % 60).padStart(2, '0')}`;
    }

    function renderQuiz() {
        const { qs, current, score, answered, selected, isExam, deadline } = state.quiz;
        if (current >= qs.length) return renderResults();
        const q = qs[current];
        const pct = (current / qs.length * 100).toFixed(0);
        const moduleLabels = ['', 'Rights', 'Institutions', 'History'];
        const keys = ['1', '2', '3', '4'];
        return `
            <div class="card">
                <div class="quiz-header">
                    <span class="module-badge module-${q.module}">Module ${q.module}: ${moduleLabels[q.module]}</span>
                    <span class="quiz-meta">
                        ${deadline ? `<span id="exam-clock" class="exam-clock${remainingMs() <= 5 * 60000 ? ' is-urgent' : ''}">${formatRemaining()}</span> · ` : ''}
                        ${current + 1} / ${qs.length} · Score: ${score}
                    </span>
                </div>
                <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
                <p class="quiz-question">${q.q}</p>
                <div class="quiz-options">
                    ${q.options.map((opt, i) => {
                        let cls = 'quiz-option';
                        if (answered) {
                            cls += ' disabled';
                            if (i === q.correct) cls += ' correct';
                            else if (i === selected && i !== q.correct) cls += ' incorrect';
                        }
                        return `<button type="button" class="${cls}" onclick="selectAnswer(${i})"${answered ? ' disabled' : ''}><span class="key-hint">${keys[i]}</span><span>${opt}</span></button>`;
                    }).join('')}
                </div>
                ${answered ? `
                    <div class="quiz-explanation"><strong>${q.correct === selected ? '✓ Correct.' : '✗ Not quite.'}</strong> ${q.explanation}</div>
                    <div class="quiz-actions"><button class="btn btn-primary btn-full" onclick="nextQuestion()">${current + 1 === qs.length ? 'See results' : 'Next question'} (Enter)</button></div>
                ` : `<div class="kbd-hint">Press <kbd>1</kbd>–<kbd>4</kbd> to answer</div>`}
                <div class="quiz-abandon">
                    <button class="btn-tiny" onclick="abandonQuiz()">${isExam ? 'End exam' : 'Leave quiz'}</button>
                </div>
            </div>
        `;
    }

    // showView() already asks for confirmation and stops the timer when leaving an
    // active quiz, so this is just the explicit button for it.
    function abandonQuiz() { showView('practice'); }

    function selectAnswer(i) {
        if (state.quiz.answered) return;
        const q = state.quiz.qs[state.quiz.current];
        state.quiz.answered = true;
        state.quiz.selected = i;
        const correct = i === q.correct;
        if (correct) state.quiz.score++;
        else state.quiz.missed.push({ ...q, chosen: i });
        recordQuestion(q.id, correct);
        saveProgress();
        render();
    }

    function nextQuestion() {
        if (state.quiz.current + 1 >= state.quiz.qs.length) { finishQuiz(); return; }
        state.quiz.current++;
        state.quiz.answered = false;
        state.quiz.selected = null;
        render();
    }

    function finishQuiz() {
        stopExamTimer();
        recordQuizResult();
        state.view = 'quizResults';
        updateNav();
        render();
        window.scrollTo({ top: 0, behavior: 'auto' });
    }

    function renderResults() {
        const { qs, score, isExam, missed, timedOut, module, answeredCount } = state.quiz;
        const answered = timedOut ? (answeredCount || 0) : qs.length;
        const pct = Math.round(score / qs.length * 100);
        const passThreshold = isExam ? meta.exam.passPct : 60;
        const passed = pct >= passThreshold;
        const moduleLabels = ['All modules', 'Rights', 'Institutions', 'History'];

        // Per-module breakdown of this attempt — tells you where the loss came from.
        const byModule = [1, 2, 3].map(m => {
            const total = qs.filter(q => q.module === m).length;
            if (!total) return null;
            const wrong = missed.filter(q => q.module === m).length;
            return { m, total, right: total - wrong, pct: Math.round((total - wrong) / total * 100) };
        }).filter(Boolean);

        return `
            <div class="card score-card">
                <h2 style="font-size:1.2rem;margin-bottom:0.75rem">${isExam ? 'Mock Exam Results' : 'Quiz Results'}</h2>
                ${timedOut ? `<div class="timeout-banner">⏱ Time ran out — ${answered} of ${qs.length} answered. Unanswered questions count as wrong, exactly as on the real exam.</div>` : ''}
                <div class="score-num" style="color:${passed ? 'var(--success)' : 'var(--error)'}">${pct}%</div>
                <div class="score-label">${score} / ${qs.length} correct${isExam ? ` (need ${meta.exam.passMark} of ${meta.exam.questionsOnExam} to pass)` : ''}</div>
                <div class="score-verdict" style="color:${passed ? 'var(--success)' : 'var(--error)'}">${passed ? '✓ PASSED' : '✗ NEEDS MORE STUDY'}</div>
                <div class="score-note">Pass mark: ${passThreshold}%</div>
            </div>

            ${byModule.length > 1 ? `
                <div class="section-label">Where you lost marks</div>
                <div class="card">
                    ${byModule.map(b => `
                        <div class="mod-bar-row">
                            <span class="mod-bar-label"><span class="module-badge module-${b.m}">M${b.m}</span> ${moduleLabels[b.m]}</span>
                            <div class="mod-bar"><div class="mod-bar-fill mod-fill-${b.m}" style="width:${b.pct}%"></div></div>
                            <span class="mod-bar-val">${b.right}/${b.total}</span>
                        </div>
                    `).join('')}
                </div>
            ` : ''}

            ${missed.length ? `
                <div class="section-label">Review the ${missed.length} you missed</div>
                <div class="card">
                    ${missed.map(q => `
                        <details class="missed-item">
                            <summary>
                                <span class="module-badge module-${q.module}">M${q.module}</span>
                                <span class="missed-q">${q.q}</span>
                            </summary>
                            <div class="missed-body">
                                <div class="missed-line missed-yours">Your answer: ${q.options[q.chosen] ?? '<em>not answered</em>'}</div>
                                <div class="missed-line missed-right">Correct: ${q.options[q.correct]}</div>
                                <p class="missed-why">${q.explanation}</p>
                            </div>
                        </details>
                    `).join('')}
                </div>
            ` : `<div class="card" style="text-align:center"><p style="color:var(--success);font-weight:700">Nothing missed. Clean run.</p></div>`}

            <div class="quiz-actions" style="justify-content:center;margin-top:1.2rem;flex-wrap:wrap">
                <button class="btn btn-secondary" onclick="showView('${isExam ? 'practice' : 'quiz'}')">${isExam ? 'Back to practice' : 'Another quiz'}</button>
                ${missed.length ? `<button class="btn btn-secondary" onclick="retryMissed()">Retry these ${missed.length}</button>` : ''}
                <button class="btn btn-primary" onclick="${isExam ? 'startExam()' : 'startQuiz(' + module + ')'}">${isExam ? 'Retry full exam' : 'New questions'}</button>
            </div>
        `;
    }

    // Re-drill exactly the questions just missed, freshly shuffled.
    function retryMissed() {
        const ids = state.quiz.missed.map(m => m.id);
        const pool = ids.map(id => questionById.get(id)).filter(Boolean);
        if (!pool.length) return;
        shuffle(pool);
        beginQuiz({ pool, module: state.quiz.module, isExam: false });
    }

    // ================== FLASHCARDS ==================
    // The deck is a plain array of cards. Per-card stats are keyed by card.id
    // (a hash of the card front), so they survive edits and reordering of data.js.
    function buildFlashDeck(prioritizeWrong) {
        const deck = flashcards.slice();
        if (prioritizeWrong) {
            // Sort by (wrong - right) descending so cards you've flunked come first.
            deck.sort((a, b) => {
                const sa = progress.flashStats[a.id] || { right: 0, wrong: 0 };
                const sb = progress.flashStats[b.id] || { right: 0, wrong: 0 };
                return (sb.wrong - sb.right) - (sa.wrong - sa.right);
            });
        } else {
            shuffle(deck);
        }
        return deck;
    }
    function startFlashcards(prioritizeWrong) {
        state.flash = { current: 0, flipped: false, deck: buildFlashDeck(prioritizeWrong), prioritized: !!prioritizeWrong };
        state.view = 'flashcards';
        updateNav(); render();
    }

    function renderFlashcards() {
        if (!state.flash.deck.length) return startFlashcards(false), '';
        const c = state.flash.deck[state.flash.current];
        const stats = progress.flashStats[c.id] || { right: 0, wrong: 0 };
        return `
            <button class="btn-back" onclick="showView('practice')">&larr; Practice</button>
            <div class="card">
                <div class="flashcard-counter">
                    Card ${state.flash.current + 1} of ${state.flash.deck.length}
                    ${state.flash.prioritized ? '<span style="color:var(--lux-red);margin-left:0.5rem">· Review mode</span>' : ''}
                    ${(stats.right || stats.wrong) ? `<span style="color:var(--text-muted);margin-left:0.5rem">· ${stats.right}✓ ${stats.wrong}✗</span>` : ''}
                </div>
                <div class="flashcard-wrap">
                    <div class="flashcard" onclick="flipCard()">
                        ${state.flash.flipped
                            ? `<div class="flashcard-back">${c.back}</div>`
                            : `<div class="flashcard-front">${c.front}</div>`}
                    </div>
                </div>
                ${state.flash.flipped ? `
                    <div class="flashcard-controls">
                        <button class="btn btn-secondary" onclick="rateCard(false)" style="color:var(--error);border-color:rgba(214,40,40,0.3)">✗ Got it wrong</button>
                        <button class="btn btn-primary" onclick="rateCard(true)" style="background:linear-gradient(135deg,var(--success),#218075)">✓ Got it right</button>
                    </div>
                ` : `
                    <div class="flashcard-controls">
                        <button class="btn btn-secondary" onclick="prevCard()">&larr; Prev</button>
                        <button class="btn btn-primary" onclick="flipCard()">Reveal</button>
                        <button class="btn btn-secondary" onclick="nextCard()">Next &rarr;</button>
                    </div>
                `}
                <div class="kbd-hint"><kbd>Space</kbd> flip · <kbd>←</kbd> <kbd>→</kbd> nav · <kbd>J</kbd> wrong · <kbd>K</kbd> right</div>
            </div>
        `;
    }
    function flipCard() { state.flash.flipped = !state.flash.flipped; render(); }
    function nextCard() { state.flash.current = (state.flash.current + 1) % state.flash.deck.length; state.flash.flipped = false; render(); }
    function prevCard() { state.flash.current = (state.flash.current - 1 + state.flash.deck.length) % state.flash.deck.length; state.flash.flipped = false; render(); }
    function shuffleCards() { shuffle(state.flash.deck); state.flash.current = 0; state.flash.flipped = false; render(); }
    function rateCard(correct) {
        const card = state.flash.deck[state.flash.current];
        if (!card) return;
        recordFlash(card.id, correct);
        // Auto-advance
        state.flash.flipped = false;
        state.flash.current = (state.flash.current + 1) % state.flash.deck.length;
        render();
    }

    // ================== TIMELINE ==================
    function renderTimelineView() {
        return `
            <button class="btn-back" onclick="showView('practice')">&larr; Practice</button>
            <div class="card">
                <h2>Timeline of Luxembourg</h2>
                <p style="color:var(--text-secondary);font-size:0.9rem;margin-bottom:1rem">${timeline.length} key dates &mdash; from Siegfried's castle to the present day.</p>
                <div class="timeline-list">
                    ${timeline.map(t => `<div class="tl-item"><span class="tl-year">${t.year}</span><span class="tl-event">${t.event}</span></div>`).join('')}
                </div>
            </div>
        `;
    }

    // ================== REFERENCE ==================
    function renderReference() {
        let html = `<div class="section-label">Study Reference</div>
        <p style="color:var(--text-secondary);font-size:0.92rem;margin-bottom:1rem;line-height:1.6">The three official modules, section by section. Every fact the exam can ask.</p>`;
        for (const key of ['module1', 'module2', 'module3']) {
            const m = studyContent[key];
            html += `<article class="card">
                <div class="module-header">
                    <span class="module-badge ${m.badge}">${m.badge.replace('module-','Module ')}</span>
                </div>
                <h2>${m.title}</h2>
                ${m.sections.map(s => `
                    <details class="study-section">
                        <summary>${s.title}</summary>
                        <div class="content">${s.content}</div>
                    </details>
                `).join('')}
            </article>`;
        }
        return html;
    }

    // ================== KEYBOARD ==================
    document.addEventListener('keydown', e => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        const k = e.key;
        // Global nav
        if (!e.ctrlKey && !e.metaKey && !e.altKey) {
            const shortcutMap = { '1': 'home', '2': 'story', '3': 'scenarios', '4': 'practice', '5': 'reference' };
            if (shortcutMap[k] && state.view !== 'quizActive') { showView(shortcutMap[k]); return; }
        }
        // Flashcards
        if (state.view === 'flashcards') {
            if (k === ' ' || k === 'Enter') { e.preventDefault(); flipCard(); }
            if (k === 'ArrowRight' || k === 'l') nextCard();
            if (k === 'ArrowLeft' || k === 'h') prevCard();
            if (k === 's' || k === 'S') shuffleCards();
            if (state.flash.flipped) {
                if (k === 'j' || k === 'J') rateCard(false);
                if (k === 'k' || k === 'K') rateCard(true);
            }
        }
        // Quiz
        if (state.view === 'quizActive') {
            if (!state.quiz.answered) {
                if (['1','2','3','4'].includes(k)) selectAnswer(parseInt(k) - 1);
            } else {
                if (k === 'Enter' || k === 'n' || k === ' ') { e.preventDefault(); nextQuestion(); }
            }
        }
    });

    // Closing the tab or hitting Back mid-quiz loses the attempt (there is no
    // history routing). Ask the browser to warn while a quiz is in flight.
    window.addEventListener('beforeunload', e => {
        if (state.view === 'quizActive' && state.quiz.current > 0) {
            e.preventDefault();
            e.returnValue = '';
        }
    });

    // ================== INIT ==================
    render();
    updateNav();
    </script>
</body>
</html>
