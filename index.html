<body>
    <header class="app-header">
        <div class="header-row">
            <div class="brand">
                <div class="brand-flag" aria-hidden="true"><div class="r"></div><div class="w"></div><div class="b"></div></div>
                <div class="brand-text">
                    <h1>Vivre Ensemble</h1>
                    <div class="sub">Luxembourg citizenship prep</div>
                </div>
            </div>
            <div class="header-right">
                <span class="exam-badge" id="exam-badge"></span>
                <button class="profile-chip" id="profile-chip" onclick="VE.showView('profiles')" aria-label="Current profile. Open profiles."></button>
            </div>
        </div>
    </header>

    <div class="layout">
        <aside class="side-nav" aria-label="Primary navigation">
            <div class="side-nav-title">Navigate</div>
            <nav id="side-nav"></nav>
            <div class="side-nav-footer" id="side-footer"></div>
        </aside>
        <main id="app"></main>
    </div>

    <nav class="bottom-nav" id="bottom-nav" aria-label="Primary navigation"></nav>

    <noscript><p style="padding:1rem">This study app needs JavaScript enabled.</p></noscript>

    <script src="data.js"></script>
    <script>
    /* The whole app lives in one IIFE and exposes a single global, VE, for the
       inline onclick handlers. data.js declares its content as top-level
       `const`s in the same global scope; a second top-level declaration of any
       of those names here would be a SyntaxError that kills the whole script,
       so nothing in this file is declared at top level except VE. */
    (function () {
    'use strict';

    // ================== CONTENT ==================
    const C = (typeof APP_CONTENT !== 'undefined' && APP_CONTENT) || {};
    const META = C.meta || {};
    const EXAM = (function () {
        const e = Object.assign({}, META.exam || {});
        e.questionsOnExam = Number(e.questionsOnExam) || 40;
        e.mix = Object.assign({ module1: 0, module2: 0, module3: 0 }, e.mix || {});
        if (!(e.mix.module1 + e.mix.module2 + e.mix.module3)) {
            const third = Math.round(e.questionsOnExam / 3);
            e.mix = { module1: third, module2: e.questionsOnExam - 2 * third, module3: third };
        }
        e.passMark = Number(e.passMark) || Math.ceil(e.questionsOnExam * 0.7);
        e.passPct = Number(e.passPct) || Math.round(e.passMark / e.questionsOnExam * 100);
        e.durationMinutes = Number(e.durationMinutes) || 60;
        return e;
    })();
    const MODS = [1, 2, 3];
    const ML = ['All modules', 'Rights', 'Institutions', 'History'];
    const mixOf = m => Number(EXAM.mix['module' + m]) || 0;

    const QUESTIONS = Array.isArray(C.questions) ? C.questions : [];
    const FLASHCARDS = Array.isArray(C.flashcards) ? C.flashcards : [];
    const TIMELINE = Array.isArray(C.timeline) ? C.timeline : [];
    const CHAPTERS = Array.isArray(C.chapters) ? C.chapters : [];
    const SCENARIOS = Array.isArray(C.scenarios) ? C.scenarios : [];
    const FIGURES = C.figures || {};
    const JOURNEY = Array.isArray(C.journey) ? C.journey : [];
    const STUDY = C.studyContent || {};
    const MODULE_KEYS = ['module1', 'module2', 'module3'].filter(k => STUDY[k] && Array.isArray(STUDY[k].sections));

    // Optional content: read from APP_CONTENT first, then from a top-level
    // global of the same name, so either way data.js exposes it works.
    const RAW_NUMBER_FACTS = Array.isArray(C.numberFacts) ? C.numberFacts
        : (typeof numberFacts !== 'undefined' && Array.isArray(numberFacts)) ? numberFacts : [];
    const RAW_EXAM_TIPS = Array.isArray(C.examTips) ? C.examTips
        : (typeof examTips !== 'undefined' && Array.isArray(examTips)) ? examTips : [];
    const EXAM_TIPS = RAW_EXAM_TIPS.filter(t => t && t.title);

    // ---- Stable content IDs -------------------------------------------------
    // Derived from each item's own text (djb2), so stats survive reordering.
    // Must stay byte-identical to the previous version to keep existing stats.
    function contentId(prefix, text) {
        let h = 5381;
        text = String(text);
        for (let i = 0; i < text.length; i++) h = ((h << 5) + h + text.charCodeAt(i)) | 0;
        return prefix + (h >>> 0).toString(36);
    }
    QUESTIONS.forEach(q => { q.id = contentId('q_', q.q); });
    FLASHCARDS.forEach(c => { c.id = contentId('f_', c.front); });
    const validModule = m => (MODS.includes(Number(m)) ? Number(m) : 0);

    const NUMBER_FACTS = RAW_NUMBER_FACTS
        .filter(f => f && f.value != null && f.label)
        .map(f => ({
            id: contentId('n_', String(f.label) + '|' + String(f.value)),
            value: String(f.value), label: String(f.label), module: validModule(f.module),
            hint: f.hint ? String(f.hint) : '', source: 'facts'
        }));
    const TIMELINE_FACTS = TIMELINE
        .filter(t => t && t.year != null && t.event)
        .map(t => ({
            id: contentId('t_', String(t.year) + '|' + String(t.event)),
            value: String(t.year), label: String(t.event), module: 3,
            hint: t.mnemonic ? String(t.mnemonic) : (t.hint ? String(t.hint) : ''), source: 'timeline'
        }));

    // Every schedulable item, keyed by id. kind: q = exam question, f = flashcard, n = number/date fact.
    const ITEMS = new Map();
    QUESTIONS.forEach(q => ITEMS.set(q.id, { id: q.id, kind: 'q', module: validModule(q.module), src: q }));
    FLASHCARDS.forEach(c => ITEMS.set(c.id, { id: c.id, kind: 'f', module: validModule(c.module), src: c }));
    NUMBER_FACTS.forEach(f => ITEMS.set(f.id, { id: f.id, kind: 'n', module: f.module, src: f }));
    TIMELINE_FACTS.forEach(f => ITEMS.set(f.id, { id: f.id, kind: 'n', module: 3, src: f }));
    const questionById = new Map(QUESTIONS.map(q => [q.id, q]));

    // Spread several streams evenly through one list: each element gets a
    // fractional position within its own stream, then everything is sorted by
    // it. Used so new items and study units arrive well mixed, in source order.
    function spreadOrder(streams) {
        const tagged = [];
        streams.forEach((arr, si) => arr.forEach((x, i) => tagged.push({ x, k: (i + 0.5) / arr.length, si })));
        tagged.sort((a, b) => a.k - b.k || a.si - b.si);
        return tagged.map(t => t.x);
    }
    const NEW_ORDER = spreadOrder([
        QUESTIONS.filter(q => q.module === 2).map(q => q.id),
        QUESTIONS.filter(q => q.module === 1).map(q => q.id),
        QUESTIONS.filter(q => q.module === 3).map(q => q.id),
        FLASHCARDS.map(c => c.id),
        NUMBER_FACTS.map(f => f.id),
        TIMELINE_FACTS.map(f => f.id)
    ]).filter((id, i, arr) => arr.indexOf(id) === i);

    // ================== UTILITIES ==================
    const ESC_MAP = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
    // Escape anything user-supplied (profile names, search text, imported
    // values) before it goes near innerHTML. Content from data.js is authored
    // HTML and is rendered as-is.
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, ch => ESC_MAP[ch]); }
    function clamp(x, lo, hi) { return Math.max(lo, Math.min(hi, x)); }
    function shuffle(arr, rng) {
        const r = rng || Math.random;
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(r() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }
    function plural(n, word, pl) { return `${n} ${n === 1 ? word : (pl || word + 's')}`; }
    function initials(name) {
        const parts = String(name || '?').trim().split(/\s+/).filter(Boolean);
        return ((parts[0] || '?')[0] + (parts[1] ? parts[1][0] : '')).toUpperCase();
    }

    // ---- Dates: whole local calendar days as integers ----
    const DAY_MS = 86400000;
    function dayFromDate(d) { return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / DAY_MS); }
    function todayDay() { return dayFromDate(new Date()); }
    function dayToISO(n) { return new Date(n * DAY_MS).toISOString().slice(0, 10); }
    function isoToDay(s) {
        if (typeof s !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return null;
        const [y, m, d] = s.split('-').map(Number);
        const t = Date.UTC(y, m - 1, d);
        if (!Number.isFinite(t)) return null;
        const back = new Date(t);
        if (back.getUTCMonth() !== m - 1 || back.getUTCDate() !== d) return null;
        return Math.floor(t / DAY_MS);
    }
    function formatDay(n, opts) {
        try {
            return new Date(n * DAY_MS).toLocaleDateString('en-GB', Object.assign({ weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' }, opts || {}));
        } catch (e) { return dayToISO(n); }
    }

    // ================== STORAGE ==================
    const LEGACY_KEY = 'vivre-ensemble-progress-v1';   // single-user blob (v1/v2 schema), left untouched
    const PROFILES_KEY = 'vivre-ensemble-profiles';
    const PROGRESS_PREFIX = 'vivre-ensemble-progress-v3:';
    const PROGRESS_VERSION = 3;

    function memoryStorage() {
        const m = new Map();
        return { getItem: k => (m.has(k) ? m.get(k) : null), setItem: (k, v) => m.set(k, String(v)), removeItem: k => m.delete(k) };
    }
    function makeStore(ls) {
        return {
            get(k) { try { return ls.getItem(k); } catch (e) { return null; } },
            set(k, v) { try { ls.setItem(k, v); return true; } catch (e) { return false; } },
            remove(k) { try { ls.removeItem(k); } catch (e) { /* ignore */ } }
        };
    }
    function defaultStorage() {
        try { const ls = window.localStorage; ls.getItem('x'); return ls; } catch (e) { return memoryStorage(); }
    }
    let STORE = makeStore(defaultStorage());
    function parseJSON(raw) { if (!raw) return null; try { return JSON.parse(raw); } catch (e) { return null; } }

    const emptyProgress = () => ({
        version: PROGRESS_VERSION,
        chaptersRead: {},       // { ch1: true }
        scenariosSeen: {},      // { sc_arrest: true }
        sectionsRead: {},       // { 'module2:3': true }
        flashStats: {},         // { f_xxx: { right, wrong } }
        questionStats: {},      // { q_xxx: { right, wrong } }
        numberStats: {},        // { n_xxx | t_xxx: { right, wrong } }
        quizAttempts: [],       // [{ ts, mode, module, score, total, pct, isExam, byModule: { 1: [right, total] } }]
        bestByModule: { 0: 0, 1: 0, 2: 0, 3: 0 },
        bestExam: null,         // { ts, score, pct }
        srs: {},                // { id: { i, e, reps, lapses, due, last, g } }  (due/last = day numbers)
        daily: {},              // { 'YYYY-MM-DD': { n, c, new, mock, num, weak, read, cheat } }
        settings: { examDate: '', dailyNew: 0 },   // dailyNew 0 = automatic
        planCache: null         // { day, examDay, ids: [unitId] } — freezes today's study units
    });

    const isObj = x => !!x && typeof x === 'object' && !Array.isArray(x);
    const num = (x, d) => (Number.isFinite(Number(x)) ? Number(x) : (d === undefined ? 0 : d));
    const DAILY_FIELDS = ['n', 'c', 'new', 'mock', 'num', 'weak', 'read', 'cheat'];

    // Coerce every field to the expected type. Imported files are untrusted,
    // and several of these values end up in rendered HTML.
    function normalizeProgress(p) {
        const out = emptyProgress();
        if (!isObj(p)) return out;
        const boolMap = x => { const o = {}; if (isObj(x)) Object.keys(x).forEach(k => { if (x[k]) o[k] = true; }); return o; };
        const statMap = x => {
            const o = {};
            if (isObj(x)) Object.keys(x).forEach(k => { const v = x[k]; if (isObj(v)) o[k] = { right: Math.max(0, Math.floor(num(v.right))), wrong: Math.max(0, Math.floor(num(v.wrong))) }; });
            return o;
        };
        out.chaptersRead = boolMap(p.chaptersRead);
        out.scenariosSeen = boolMap(p.scenariosSeen);
        out.sectionsRead = boolMap(p.sectionsRead);
        out.flashStats = statMap(p.flashStats);
        out.questionStats = statMap(p.questionStats);
        out.numberStats = statMap(p.numberStats);
        out.quizAttempts = (Array.isArray(p.quizAttempts) ? p.quizAttempts : []).filter(isObj).slice(-60).map(a => {
            const bm = {};
            if (isObj(a.byModule)) MODS.forEach(m => { const v = a.byModule[m]; if (Array.isArray(v) && v.length === 2) bm[m] = [Math.max(0, num(v[0])), Math.max(0, num(v[1]))]; });
            return {
                ts: num(a.ts), mode: typeof a.mode === 'string' ? a.mode.slice(0, 12) : (a.isExam ? 'exam' : 'quiz'),
                module: validModule(a.module), score: num(a.score), total: num(a.total), pct: clamp(num(a.pct), 0, 100),
                isExam: !!a.isExam, byModule: bm
            };
        });
        [0, 1, 2, 3].forEach(k => { out.bestByModule[k] = clamp(num(isObj(p.bestByModule) ? p.bestByModule[k] : 0), 0, 100); });
        out.bestExam = isObj(p.bestExam) ? { ts: num(p.bestExam.ts), score: num(p.bestExam.score), pct: clamp(num(p.bestExam.pct), 0, 100) } : null;
        if (isObj(p.srs)) Object.keys(p.srs).forEach(k => {
            const s = p.srs[k];
            if (!isObj(s)) return;
            out.srs[k] = {
                i: Math.max(0, Math.floor(num(s.i))), e: clamp(num(s.e, 2.5), 1.3, 3.0),
                reps: Math.max(0, Math.floor(num(s.reps))), lapses: Math.max(0, Math.floor(num(s.lapses))),
                due: Math.floor(num(s.due)), last: Math.floor(num(s.last)), g: clamp(Math.floor(num(s.g, 3)), 1, 4)
            };
        });
        if (isObj(p.daily)) Object.keys(p.daily).filter(k => isoToDay(k) !== null).sort().slice(-180).forEach(k => {
            const d = p.daily[k]; if (!isObj(d)) return;
            const o = {}; DAILY_FIELDS.forEach(f => { if (num(d[f])) o[f] = Math.max(0, Math.floor(num(d[f]))); });
            out.daily[k] = o;
        });
        if (isObj(p.settings)) {
            out.settings.examDate = isoToDay(p.settings.examDate) !== null ? p.settings.examDate : '';
            out.settings.dailyNew = clamp(Math.floor(num(p.settings.dailyNew)), 0, 200);
        }
        if (isObj(p.planCache) && Array.isArray(p.planCache.ids)) {
            out.planCache = {
                day: Math.floor(num(p.planCache.day)),
                examDay: p.planCache.examDay == null ? null : Math.floor(num(p.planCache.examDay)),
                ids: p.planCache.ids.filter(x => typeof x === 'string').slice(0, 60)
            };
        }
        return out;
    }

    // Older progress (v1/v2) had right/wrong counts but no schedule. Seed the
    // scheduler from them so nothing already practised counts as "new", and
    // the shaky items come up first.
    function seedSrsFromStats(p, today) {
        const seed = (id, s) => {
            if (p.srs[id] || !s || (s.right + s.wrong) === 0) return;
            const weak = s.wrong >= s.right;
            const i = weak ? 0 : (s.right - s.wrong >= 3 ? 3 : 1);
            p.srs[id] = { i, e: 2.5, reps: weak ? 0 : Math.min(2, s.right), lapses: s.wrong, due: today + (i === 3 ? 1 : 0), last: today, g: weak ? 1 : 3 };
        };
        Object.entries(p.questionStats).forEach(([id, s]) => seed(id, s));
        Object.entries(p.flashStats).forEach(([id, s]) => seed(id, s));
        return p;
    }

    function migrateProgress(raw, today, flashDeck) {
        if (!isObj(raw)) return emptyProgress();
        const deck = flashDeck || FLASHCARDS;
        let base = Object.assign({}, raw);
        const v = Number(raw.version) || 1;
        if (v === 1) {
            // v1 keyed flashStats by array index; remap through deck order.
            const remapped = {};
            Object.entries(isObj(raw.flashStats) ? raw.flashStats : {}).forEach(([key, val]) => {
                const card = deck[Number(key)];
                if (card) remapped[card.id] = val;
            });
            base.flashStats = remapped;
            base.questionStats = {};
        }
        let p = normalizeProgress(base);
        if (v < 3) p = seedSrsFromStats(p, today);
        p.version = PROGRESS_VERSION;
        return p;
    }

    // ---- Profiles ----------------------------------------------------------
    // Index: { version: 1, active: id, list: [{ id, name, created }] }
    // Each profile's progress: PROGRESS_PREFIX + id.
    function newProfileId() { return 'p' + Date.now().toString(36) + Math.floor(Math.random() * 1e6).toString(36); }
    function cleanName(name, fallback) {
        const s = String(name == null ? '' : name).replace(/[\u0000-\u001f\u007f]/g, '').replace(/\s+/g, ' ').trim().slice(0, 40);
        return s || fallback;
    }
    function normalizeIndex(idx) {
        if (!isObj(idx) || !Array.isArray(idx.list)) return null;
        const seen = new Set();
        const list = idx.list.filter(x => isObj(x) && typeof x.id === 'string' && /^[a-z0-9]{1,40}$/.test(x.id) && !seen.has(x.id) && seen.add(x.id))
            .map((x, i) => ({ id: x.id, name: cleanName(x.name, 'Profile ' + (i + 1)), created: num(x.created) }));
        if (!list.length) return null;
        const active = list.some(x => x.id === idx.active) ? idx.active : list[0].id;
        return { version: 1, active, list };
    }
    // First run of this version: create a first profile and move any legacy
    // single-user progress into it. The legacy key is left in place (never
    // deleted), and the index's existence stops the migration re-running.
    function loadProfiles(store, today) {
        const existing = normalizeIndex(parseJSON(store.get(PROFILES_KEY)));
        if (existing) return existing;
        const id = newProfileId();
        const idx = { version: 1, active: id, list: [{ id, name: 'Profile 1', created: Date.now() }] };
        const legacy = parseJSON(store.get(LEGACY_KEY));
        if (legacy && isObj(legacy)) {
            const migrated = migrateProgress(legacy, today);
            store.set(PROGRESS_PREFIX + id, JSON.stringify(migrated));
            idx.migratedLegacy = true;
        }
        store.set(PROFILES_KEY, JSON.stringify(idx));
        return idx;
    }
    function loadProgressFor(store, id, today) {
        const raw = parseJSON(store.get(PROGRESS_PREFIX + id));
        return raw ? migrateProgress(raw, today) : emptyProgress();
    }

    let profiles = loadProfiles(STORE, todayDay());
    let progress = loadProgressFor(STORE, profiles.active, todayDay());
    function activeProfile() { return profiles.list.find(p => p.id === profiles.active) || profiles.list[0]; }
    function saveProfiles() { STORE.set(PROFILES_KEY, JSON.stringify(profiles)); }
    function saveProgress() {
        if (!STORE.set(PROGRESS_PREFIX + profiles.active, JSON.stringify(progress))) {
            if (!saveProgress.warned) { saveProgress.warned = true; alert('Could not save progress (browser storage is full or blocked). Export a backup.'); }
        }
    }

    // ================== SPACED REPETITION ==================
    // SM-2-lite. grade: 1 Again, 2 Hard, 3 Good, 4 Easy. Intervals in days.
    // With an exam date set, no interval may jump past the day before the exam,
    // so every learned item comes back at least once before the real thing.
    const MAX_INTERVAL = 45;
    function srsSchedule(prev, grade, today, examDay) {
        const s = prev ? Object.assign({}, prev) : { i: 0, e: 2.5, reps: 0, lapses: 0 };
        grade = clamp(Math.round(grade) || 3, 1, 4);
        let i;
        if (grade === 1) {
            s.lapses = (s.lapses || 0) + 1; s.reps = 0; s.e = Math.max(1.3, s.e - 0.2); i = 0;
        } else {
            if (grade === 2) { s.e = Math.max(1.3, s.e - 0.15); i = Math.max(1, Math.round(s.i * 1.2)); if (s.reps === 0) i = 1; }
            else if (grade === 3) { i = s.reps === 0 ? 1 : s.reps === 1 ? 3 : Math.max(s.i + 1, Math.round(s.i * s.e)); }
            else { s.e = Math.min(3.0, s.e + 0.15); i = s.reps === 0 ? 3 : Math.max(s.i + 2, Math.round(Math.max(1, s.i) * s.e * 1.3)); }
            s.reps += 1;
        }
        i = Math.min(i, MAX_INTERVAL);
        if (examDay != null && today < examDay - 1 && today + i > examDay - 1) i = Math.max(grade === 1 ? 0 : 1, examDay - 1 - today);
        s.i = i; s.due = today + i; s.last = today; s.g = grade;
        return s;
    }
    function fmtInterval(i) { return i <= 0 ? 'today' : i === 1 ? '1 day' : i < 30 ? `${i} days` : `${Math.round(i / 30)} mo`; }

    // Estimated chance of recalling an item right now.
    function recallProb(s, st, today) {
        let pS = null, pA = null;
        if (s) {
            pS = s.g === 1 ? 0.45 : s.i >= 7 ? 0.93 : s.i >= 3 ? 0.88 : s.i >= 1 ? 0.8 : 0.6;
            const overdue = today - s.due;
            if (overdue > 0) pS *= Math.max(0.7, 1 - 0.03 * overdue);
        }
        if (st && (st.right + st.wrong) > 0) pA = (st.right + 1) / (st.right + st.wrong + 2);
        if (pS !== null && pA !== null) return 0.6 * pS + 0.4 * pA;
        return pS !== null ? pS : pA;
    }

    // P(total correct >= passMark) when module m contributes n_m questions, each
    // right with probability p_m. Exact: convolution of per-question Bernoullis.
    function passProbability(ps, mix, passMark) {
        let dist = [1];
        MODS.forEach(m => {
            const n = Number(mix['module' + m]) || 0;
            const p = clamp(Number(ps[m]) || 0, 0, 1);
            for (let t = 0; t < n; t++) {
                const next = new Array(dist.length + 1).fill(0);
                for (let k = 0; k < dist.length; k++) { next[k] += dist[k] * (1 - p); next[k + 1] += dist[k] * p; }
                dist = next;
            }
        });
        let pass = 0;
        for (let k = passMark; k < dist.length; k++) pass += dist[k];
        return clamp(pass, 0, 1);
    }

    function moduleReadFraction(p, m) {
        const key = 'module' + m;
        const secs = STUDY[key] ? STUDY[key].sections.length : 0;
        let done = 0, total = secs;
        for (let i = 0; i < secs; i++) if (p.sectionsRead[key + ':' + i]) done++;
        if (m === 3) { total += CHAPTERS.length; done += CHAPTERS.filter(c => p.chaptersRead[c.id]).length; }
        return total ? done / total : 0;
    }

    // Readiness: per-module chance of answering a random exam question, from
    // (a) the scheduler's view of every question in the pool — unseen ones get
    // an educated-guess baseline that rises with reading — and (b) recent mock
    // exams, which get more weight the more of them there are.
    function estimateReadiness(p, today) {
        const modules = {};
        let seenTotal = 0;
        const recentMocks = p.quizAttempts.filter(a => a.isExam && a.byModule && Object.keys(a.byModule).length && (today - Math.floor(a.ts / DAY_MS)) <= 21).slice(-3);
        MODS.forEach(m => {
            const pool = QUESTIONS.filter(q => q.module === m);
            const readF = moduleReadFraction(p, m);
            const unseenP = 0.3 + 0.25 * readF;
            let sum = 0, seen = 0, mature = 0;
            pool.forEach(q => {
                const r = recallProb(p.srs[q.id], p.questionStats[q.id], today);
                if (r === null) sum += unseenP; else { sum += r; seen++; if (p.srs[q.id] && p.srs[q.id].i >= 3) mature++; }
            });
            const pSrs = pool.length ? sum / pool.length : unseenP;
            let right = 0, total = 0;
            recentMocks.forEach(a => { const v = a.byModule[m]; if (v) { right += v[0]; total += v[1]; } });
            const pMock = total ? right / total : null;
            const w = pMock === null ? 0 : Math.min(0.6, 0.2 * recentMocks.length);
            const pm = pMock === null ? pSrs : w * pMock + (1 - w) * pSrs;
            modules[m] = { p: pm, pSrs, pMock, seen, mature, pool: pool.length, coverage: pool.length ? seen / pool.length : 0 };
            seenTotal += seen;
        });
        const ps = {}; MODS.forEach(m => { ps[m] = modules[m].p; });
        const expected = MODS.reduce((s, m) => s + ps[m] * mixOf(m), 0);
        const passProb = passProbability(ps, EXAM.mix, EXAM.passMark);
        const coverage = QUESTIONS.length ? seenTotal / QUESTIONS.length : 0;
        const confidence = (recentMocks.length >= 2 && coverage >= 0.5) ? 'good' : (recentMocks.length >= 1 || coverage >= 0.25) ? 'medium' : 'low';
        return { modules, expected, passProb, seenTotal, coverage, mocks: recentMocks.length, confidence, enough: seenTotal >= 20 || recentMocks.length > 0 };
    }

    // ================== DAILY LOG & STREAK ==================
    function logDaily(field, inc) {
        const key = dayToISO(todayDay());
        const d = progress.daily[key] || (progress.daily[key] = {});
        d[field] = (d[field] || 0) + (inc === undefined ? 1 : inc);
    }
    function todayLog() { return progress.daily[dayToISO(todayDay())] || {}; }
    function computeStreak(daily, today) {
        const active = d => { const x = daily[dayToISO(d)]; return !!x && DAILY_FIELDS.some(f => x[f] > 0); };
        const activeToday = active(today);
        let d = activeToday ? today : today - 1, streak = 0;
        while (active(d) && streak < 400) { streak++; d--; }
        return { streak, activeToday };
    }

    // ================== STUDY PLAN ==================
    // A study "unit" is one thing to read: a story chapter, a reference section
    // or a scenario. Weights are rough relative effort.
    function planUnits() {
        const streams = [];
        MODULE_KEYS.forEach(key => {
            const m = Number(key.slice(-1));
            streams.push(STUDY[key].sections.map((s, i) => ({ id: `sec:${key}:${i}`, type: 'section', module: m, key, index: i, weight: 1, label: `M${m} reference · ${s.title}` })));
        });
        streams.push(CHAPTERS.map(ch => ({ id: 'ch:' + ch.id, type: 'chapter', module: 3, ref: ch.id, weight: 1.5, label: `Story ch. ${ch.number}: ${ch.title}` })));
        streams.push(SCENARIOS.map(s => ({ id: 'sc:' + s.id, type: 'scenario', module: validModule(s.module), ref: s.id, weight: 0.5, label: `Scenario · ${s.title}` })));
        // Institutions is half the exam: put its stream first so ties favour it.
        const m2 = streams.findIndex(s => s[0] && s[0].module === 2 && s[0].type === 'section');
        if (m2 > 0) streams.unshift(streams.splice(m2, 1)[0]);
        return spreadOrder(streams);
    }
    const PLAN_UNITS = planUnits();
    const unitById = new Map(PLAN_UNITS.map(u => [u.id, u]));
    function unitDone(u, p) {
        if (u.type === 'section') return !!p.sectionsRead[u.key + ':' + u.index];
        if (u.type === 'chapter') return !!p.chaptersRead[u.ref];
        if (u.type === 'scenario') return !!p.scenariosSeen[u.ref];
        return false;
    }

    // Pure plan generator. Days run from `today` to the day before the exam,
    // plus the exam day. The last stretch (up to 7 days) is the final phase:
    // at least three full mocks (fewer only if there are fewer days), weak-spot
    // and numbers drills. Unread units are spread over the learning days by
    // weight; if time is short everything compresses into the days available.
    function buildPlan(opts) {
        const today = opts.today;
        const assumed = opts.examDay == null;
        const exam = assumed ? today + 30 : opts.examDay;
        const daysLeft = exam - today;
        const remaining = opts.remaining || [];
        const fixed = opts.fixedToday || null;
        if (daysLeft <= 0) {
            return { days: [{ day: today, phase: 'exam', tasks: [{ type: 'examday' }] }], daysLeft, exam, assumed, finalStart: today, mockDays: [] };
        }
        const finalLen = daysLeft >= 14 ? 7 : Math.max(1, Math.ceil(daysLeft / 2));
        const finalStart = exam - finalLen;
        const mockEnd = finalLen >= 4 ? exam - 2 : exam - 1;
        const nMocks = Math.min(3, mockEnd - finalStart + 1);
        const step = nMocks > 1 ? Math.max(1, Math.floor((mockEnd - finalStart) / (nMocks - 1))) : 0;
        const mockDays = new Set();
        for (let k = 0; k < nMocks; k++) mockDays.add(mockEnd - (nMocks - 1 - k) * step);
        const baselineDay = (daysLeft >= 10 && !opts.anyMockEver) ? today : null;
        const midDay = daysLeft >= 18 ? today + Math.floor((finalStart - today) / 2) : null;

        // Learning days: before the final phase if there are any, else all days.
        const learnDays = [];
        const lastLearn = finalStart > today ? finalStart - 1 : exam - 1;
        for (let d = today; d <= lastLearn; d++) learnDays.push(d);
        const byDay = new Map();
        let targets = learnDays;
        if (fixed) {
            byDay.set(today, fixed.slice());
            targets = learnDays.filter(d => d !== today);
            if (!targets.length) targets = [today];
        }
        const totalW = remaining.reduce((s, u) => s + (u.weight || 1), 0);
        const perDay = totalW / Math.max(1, targets.length);
        let cum = 0;
        remaining.forEach(u => {
            const idx = Math.min(targets.length - 1, Math.floor((cum + 1e-9) / (perDay || 1)));
            const d = targets[idx];
            if (!byDay.has(d)) byDay.set(d, []);
            byDay.get(d).push(u);
            cum += u.weight || 1;
        });

        const days = [];
        for (let d = today; d < exam; d++) {
            const phase = d >= finalStart ? 'final' : 'learn';
            const tasks = [{ type: 'review' }];
            (byDay.get(d) || []).forEach(u => tasks.push({ type: 'unit', unit: u }));
            if (d === baselineDay) tasks.push({ type: 'baseline' });
            else if (d === midDay || mockDays.has(d)) tasks.push({ type: 'mock' });
            if (phase === 'final') {
                tasks.push({ type: 'weak' });
                tasks.push({ type: 'numbers' });
                if (d === exam - 1) tasks.push({ type: 'cheatsheet' });
            } else if ((d - today) % 3 === 2) {
                tasks.push({ type: 'numbers' });
            }
            days.push({ day: d, phase, tasks });
        }
        days.push({ day: exam, phase: 'exam', tasks: [{ type: 'examday' }] });
        return { days, daysLeft, exam, assumed, finalStart, mockDays: [...mockDays].sort((a, b) => a - b) };
    }

    function examDayOf(p) { return isoToDay(p.settings.examDate); }
    function unseenCount(p) { let n = 0; ITEMS.forEach((_, id) => { if (!p.srs[id]) n++; }); return n; }
    function autoDailyNew(p, today) {
        const examDay = examDayOf(p);
        const days = examDay == null ? 30 : examDay - today;
        return clamp(Math.ceil(unseenCount(p) / Math.max(1, days - 3)), 10, 60);
    }
    function newPerDay(p, today) { return p.settings.dailyNew > 0 ? p.settings.dailyNew : autoDailyNew(p, today); }
    function dueCount(p, day) { let n = 0; ITEMS.forEach((_, id) => { const s = p.srs[id]; if (s && s.due <= day) n++; }); return n; }

    // App-level plan: freezes today's units in progress.planCache so ticking
    // one off does not pull tomorrow's work into today's list.
    function currentPlan() {
        const today = todayDay();
        const examDay = examDayOf(progress);
        const pc = progress.planCache;
        let fixed = null;
        if (pc && pc.day === today && pc.examDay === (examDay == null ? null : examDay)) {
            fixed = pc.ids.map(id => unitById.get(id)).filter(Boolean);
        }
        const fixedSet = new Set((fixed || []).map(u => u.id));
        const remaining = PLAN_UNITS.filter(u => !unitDone(u, progress) && !fixedSet.has(u.id));
        const plan = buildPlan({ today, examDay, remaining, fixedToday: fixed, anyMockEver: progress.quizAttempts.some(a => a.isExam) });
        if (!fixed) {
            progress.planCache = { day: today, examDay: examDay == null ? null : examDay, ids: plan.days[0].tasks.filter(t => t.type === 'unit').map(t => t.unit.id) };
            saveProgress();
        }
        return plan;
    }

    function todayContext() {
        const today = todayDay();
        const log = todayLog();
        const npd = newPerDay(progress, today);
        return {
            today, log, newPerDay: npd,
            due: dueCount(progress, today),
            newLeft: Math.max(0, Math.min(npd - (log.new || 0), unseenCount(progress))),
            plan: currentPlan(),
            streak: computeStreak(progress.daily, today)
        };
    }

    // ================== NUMBERS DRILL: QUESTION BUILDER ==================
    function firstNumber(s) {
        const t = String(s).replace(/(\d)[,\u202f\u00a0 ](?=\d{3}\b)/g, '$1');
        const y = t.match(/\b\d{4}\b/);
        if (y) return Number(y[0]);
        const m = t.match(/-?\d+(?:\.\d+)?/);
        return m ? Number(m[0]) : null;
    }
    const normVal = v => String(v).trim().toLowerCase();
    // When a module has too few distinct values, invent plausible neighbours
    // of a single-number answer (9 -> 7, 8, 10, 11 ...).
    function numericNeighbours(value, taken, k) {
        const nums = String(value).match(/\d+/g);
        if (!nums || nums.length !== 1) return [];
        const n = Number(nums[0]);
        const isYear = n >= 1000 && n <= 2100;
        const deltas = (isYear || n < 100) ? [1, -1, 2, -2, 3, -3, 5, -5, 10, -10]
            : [Math.round(n * 0.1), -Math.round(n * 0.1), Math.round(n * 0.25), -Math.round(n * 0.25), Math.round(n * 0.5), -Math.round(n * 0.5), n];
        const out = [];
        for (const d of deltas) {
            if (out.length >= k) break;
            const v = n + d;
            if (v <= 0 || d === 0) continue;
            const cand = String(value).replace(/\d+/, String(v));
            if (!taken.has(normVal(cand))) { taken.add(normVal(cand)); out.push(cand); }
        }
        return out;
    }
    function nearestFirst(items, target, valueOf, rng) {
        const scored = items.map(x => { const n = firstNumber(valueOf(x)); return { x, d: (target === null || n === null) ? Infinity : Math.abs(n - target) }; });
        shuffle(scored, rng);                      // random among equal distances
        scored.sort((a, b) => a.d - b.d);
        const near = scored.slice(0, 6); shuffle(near, rng);   // confusable, but not always the same three
        return near.concat(scored.slice(6)).map(s => s.x);
    }
    // Build one multiple-choice item from a number fact. dir 'fwd': label -> value;
    // 'rev': value -> label. Distractors come from the same module where possible.
    function buildNumberQuestion(fact, allFacts, dir, rng) {
        rng = rng || Math.random;
        let pool = allFacts.filter(f => f.id !== fact.id && f.source === fact.source && f.module === fact.module);
        if (pool.length < 3) pool = allFacts.filter(f => f.id !== fact.id && f.source === fact.source);
        if (pool.length < 3) pool = allFacts.filter(f => f.id !== fact.id);
        const isTl = fact.source === 'timeline';
        const target = firstNumber(fact.value);
        const explanation = `<strong>${fact.value}</strong> &mdash; ${fact.label}`;
        const base = { kind: 'mcq', id: fact.id, module: fact.module || 0, explanation, mnemonic: fact.hint || '' };
        if (dir === 'rev') {
            const cand = nearestFirst(pool.filter(f => normVal(f.value) !== normVal(fact.value)), target, f => f.value, rng);
            const labels = new Set([normVal(fact.label)]);
            const picks = [];
            for (const f of cand) { if (picks.length === 3) break; if (!labels.has(normVal(f.label))) { labels.add(normVal(f.label)); picks.push(f.label); } }
            if (picks.length === 3) {
                const opts = shuffle([fact.label].concat(picks), rng);
                return Object.assign(base, {
                    q: `<span class="nq-kicker">${isTl ? 'What happened in this year?' : 'What does this number refer to?'}</span>${fact.value}`,
                    options: opts, correct: opts.indexOf(fact.label)
                });
            }
        }
        const taken = new Set([normVal(fact.value)]);
        const distract = [];
        nearestFirst(pool, target, f => f.value, rng).forEach(f => {
            if (distract.length < 3 && !taken.has(normVal(f.value))) { taken.add(normVal(f.value)); distract.push(f.value); }
        });
        if (distract.length < 3) distract.push(...numericNeighbours(fact.value, taken, 3 - distract.length));
        if (!distract.length) return null;
        const opts = shuffle([fact.value].concat(distract), rng);
        return Object.assign(base, {
            q: `<span class="nq-kicker">${isTl ? 'In which year?' : 'Which number or date?'}</span>${fact.label}`,
            options: opts, correct: opts.indexOf(fact.value)
        });
    }
    const ALL_FACTS = NUMBER_FACTS.concat(TIMELINE_FACTS);

    // ================== ITEM MATERIALISATION ==================
    // Answer position in the source data is skewed, so every drawn question gets
    // its own option shuffle.
    function prepareQuestion(q) {
        const order = shuffle(q.options.map((text, i) => ({ text, isCorrect: i === q.correct })));
        return {
            kind: 'mcq', id: q.id, module: validModule(q.module), q: q.q, explanation: q.explanation,
            mnemonic: q.mnemonic ? String(q.mnemonic) : '',
            options: order.map(o => o.text), correct: order.findIndex(o => o.isCorrect)
        };
    }
    function materialize(ref) {
        const it = ITEMS.get(ref.id);
        if (!it) return null;
        if (it.kind === 'q') return prepareQuestion(it.src);
        if (it.kind === 'f') return { kind: 'card', id: it.id, module: it.module, front: it.src.front, back: it.src.back, mnemonic: it.src.mnemonic ? String(it.src.mnemonic) : '' };
        const dir = ref.dir || (Math.random() < 0.5 ? 'fwd' : 'rev');
        return buildNumberQuestion(it.src, ALL_FACTS, dir);
    }

    // ================== RECORDING ==================
    function statsBucket(id) {
        const k = ITEMS.get(id) ? ITEMS.get(id).kind : (id[0] === 'f' ? 'f' : id[0] === 'q' ? 'q' : 'n');
        return k === 'q' ? progress.questionStats : k === 'f' ? progress.flashStats : progress.numberStats;
    }
    function recordStat(id, correct) {
        const bucket = statsBucket(id);
        const s = bucket[id] || { right: 0, wrong: 0 };
        if (correct) s.right++; else s.wrong++;
        bucket[id] = s;
    }
    function applyGrade(id, grade) {
        const today = todayDay();
        const prev = progress.srs[id];
        if (!prev) logDaily('new');
        progress.srs[id] = srsSchedule(prev, grade, today, examDayOf(progress));
        logDaily('n');
        if (grade > 1) logDaily('c');
    }
    function recordQuizResult(r) {
        const pct = r.total ? Math.round(r.score / r.total * 100) : 0;
        const byModule = {};
        MODS.forEach(m => {
            const rows = r.attempts.filter(a => a.module === m);
            if (rows.length) byModule[m] = [rows.filter(a => a.correct).length, rows.length];
        });
        progress.quizAttempts.push({ ts: Date.now(), mode: r.mode, module: r.module, score: r.score, total: r.total, pct, isExam: r.isExam, byModule });
        if (r.isExam) {
            if (!progress.bestExam || pct > progress.bestExam.pct) progress.bestExam = { ts: Date.now(), score: r.score, pct };
        } else if (r.mode !== 'numbers') {
            if (pct > (progress.bestByModule[r.module] || 0)) progress.bestByModule[r.module] = pct;
        }
        if (progress.quizAttempts.length > 60) progress.quizAttempts = progress.quizAttempts.slice(-60);
    }

    function weakQuestions(module) {
        return QUESTIONS
            .filter(q => !module || q.module === module)
            .map(q => ({ q, s: progress.questionStats[q.id] }))
            .filter(({ s }) => s && s.wrong > 0 && s.wrong >= s.right)
            .sort((a, b) => (b.s.wrong - b.s.right) - (a.s.wrong - a.s.right))
            .map(({ q }) => q);
    }
    function moduleAccuracy(module) {
        let right = 0, total = 0;
        QUESTIONS.filter(q => q.module === module).forEach(q => {
            const s = progress.questionStats[q.id];
            if (s) { right += s.right; total += s.right + s.wrong; }
        });
        return total ? { pct: Math.round(right / total * 100), total } : null;
    }
    function questionsSeenCount() { return QUESTIONS.filter(q => progress.questionStats[q.id] || progress.srs[q.id]).length; }
    function chapterReadCount() { return CHAPTERS.filter(c => progress.chaptersRead[c.id]).length; }

    // ================== STATE ==================
    const state = {
        view: 'home',
        chapterId: null,
        scenarioId: null,
        refQuery: '',
        refOpen: null,
        session: null,   // practice quiz / drills / today's review
        exam: null,      // mock exam in progress
        result: null,    // last finished session or exam
        flash: { current: 0, flipped: false, deck: [], prioritized: false }
    };

    // ================== ROUTER ==================
    function inFlight() {
        if (state.view === 'session' && state.session && state.session.queue.length && state.session.mode !== 'review') {
            return state.session.pos > 0 || state.session.answered;
        }
        return (state.view === 'exam' || state.view === 'examReview') && !!state.exam;
    }
    function confirmLeave() {
        if (!inFlight()) return true;
        if (state.view === 'exam' || state.view === 'examReview') {
            if (!confirm('Discard this mock exam? Your answers will not be scored or saved.')) return false;
            stopExamTimer(); state.exam = null; return true;
        }
        const s = state.session;
        return confirm(`Leave this ${s.mode === 'numbers' ? 'drill' : 'quiz'}? You are on item ${s.pos + 1} of ${s.queue.length}. Answers so far are kept in your stats, but no score is recorded.`);
    }
    function showView(view, arg) {
        if (view !== state.view && !confirmLeave()) return;
        if (state.view === 'session' && view !== 'session' && state.session && state.session.mode === 'review' && state.session.graded > 0) {
            // Review answers are saved as you go; leaving just ends the session.
            state.session = null;
        }
        state.view = view;
        if (view === 'chapter') state.chapterId = arg;
        if (view === 'reference') state.refOpen = arg || null;
        if (view === 'scenario') {
            state.scenarioId = arg;
            if (arg && !progress.scenariosSeen[arg]) { progress.scenariosSeen[arg] = true; logDaily('read'); saveProgress(); }
        }
        if (view === 'cheatsheet') { logDaily('cheat'); saveProgress(); }
        render();
        window.scrollTo({ top: 0, behavior: 'auto' });
        if (view === 'reference' && arg) {
            setTimeout(() => { const el = document.getElementById('sec-' + arg.replace(':', '-')); if (el) el.scrollIntoView({ block: 'start' }); }, 0);
        }
    }

    const NAV = [
        { view: 'home', icon: '&#127968;', label: 'Home', key: '1', bottom: 'Home' },
        { view: 'session', icon: '&#128257;', label: "Today's review", key: '6', bottom: 'Review', action: 'VE.startReview()', badge: true },
        { view: 'plan', icon: '&#128197;', label: 'Study plan', key: '7' },
        { view: 'story', icon: '&#128213;', label: 'The Story', key: '2', bottom: 'Story' },
        { view: 'scenarios', icon: '&#127919;', label: 'Scenarios', key: '3' },
        { view: 'practice', icon: '&#9889;', label: 'Practice', key: '4', bottom: 'Practice' },
        { view: 'reference', icon: '&#128218;', label: 'Reference', key: '5', bottom: 'Reference' },
        { view: 'numbers', icon: '&#128290;', label: 'Numbers & dates', key: '8' },
        { view: 'tips', icon: '&#128161;', label: 'Exam technique', key: '9', hidden: !EXAM_TIPS.length },
        { view: 'cheatsheet', icon: '&#128424;', label: 'Cheat sheet' },
        { view: 'profiles', icon: '&#128101;', label: 'Profiles' }
    ];
    function navAction(n) { return n.action || `VE.showView('${n.view}')`; }
    function buildNav() {
        const due = dueCount(progress, todayDay());
        const badge = n => (n.badge && due ? `<span class="nav-badge" aria-label="${due} due">${due > 99 ? '99+' : due}</span>` : '');
        document.getElementById('side-nav').innerHTML = NAV.filter(n => !n.hidden).map(n =>
            `<button onclick="${navAction(n)}" data-view="${n.view}"><span class="nav-icon" aria-hidden="true">${n.icon}</span><span>${n.label}</span>${badge(n)}${n.key ? `<span class="shortcut">${n.key}</span>` : ''}</button>`).join('');
        document.getElementById('bottom-nav').innerHTML = NAV.filter(n => n.bottom && !n.hidden).map(n =>
            `<button class="nav-item" onclick="${navAction(n)}" data-view="${n.view}"><span class="nav-icon" aria-hidden="true">${n.icon}</span>${n.bottom}${badge(n)}</button>`).join('');
        document.getElementById('side-footer').innerHTML = `
            <div><strong>Real exam:</strong> ${EXAM.questionsOnExam} MCQs</div>
            <div>${mixOf(1)} Rights + ${mixOf(2)} Institutions + ${mixOf(3)} History</div>

            ${EXAM.venue ? `<div>${EXAM.venue}${EXAM.cost ? ' &middot; ' + EXAM.cost : ''}</div>` : ''}`;
        updateNav();
    }
    function updateNav() {
        const parentMap = {
            chapter: 'story', scenario: 'scenarios', quiz: 'practice', results: 'practice', flashcards: 'practice',
            timeline: 'practice', exam: 'practice', examReview: 'practice'
        };
        let parent = parentMap[state.view] || state.view;
        if (state.view === 'session') parent = state.session && state.session.mode === 'review' ? 'session' : 'practice';
        if (state.view === 'results' && state.result && state.result.mode === 'review') parent = 'session';
        document.querySelectorAll('[data-view]').forEach(b => {
            const on = b.dataset.view === parent;
            b.classList.toggle('active', on);
            if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
        });
    }
    function updateHeader() {
        const p = activeProfile();
        const examDay = examDayOf(progress);
        let days = '';
        if (examDay != null) {
            const d = examDay - todayDay();
            days = d > 1 ? `${d} days` : d === 1 ? 'tomorrow' : d === 0 ? 'exam today' : '';
        }
        const chip = document.getElementById('profile-chip');
        chip.innerHTML = `<span class="pc-avatar" aria-hidden="true">${esc(initials(p.name))}</span><span class="pc-name">${esc(p.name)}</span>${days ? `<span class="pc-days">&middot; ${esc(days)}</span>` : ''}`;
        chip.setAttribute('aria-label', `Profile: ${p.name}. Switch or manage profiles.`);
        document.getElementById('exam-badge').textContent = `${EXAM.questionsOnExam}Q · ${EXAM.durationMinutes} min · pass ${EXAM.passMark}`;
    }

    let lastRenderedView = null;
    function render() {
        const app = document.getElementById('app');
        const views = {
            home: renderHome, story: renderStory, chapter: renderChapter, scenarios: renderScenarios, scenario: renderScenario,
            practice: renderPractice, quiz: renderQuizSetup, session: renderSession, results: renderResults,
            exam: renderExam, examReview: renderExamReview, flashcards: renderFlashcards, timeline: renderTimelineView,
            reference: renderReference, plan: renderPlan, numbers: renderNumbersSetup, tips: renderTips,
            cheatsheet: renderCheatSheet, profiles: renderProfiles
        };
        let fn = views[state.view] || renderHome;
        if ((state.view === 'session' && !state.session) || ((state.view === 'exam' || state.view === 'examReview') && !state.exam) || (state.view === 'results' && !state.result) || (state.view === 'tips' && !EXAM_TIPS.length)) {
            state.view = 'home'; fn = renderHome;
        }
        const html = fn();
        const isNewView = state.view !== lastRenderedView;
        lastRenderedView = state.view;
        app.innerHTML = `<div class="${isNewView ? 'view' : ''}">${html}</div>`;
        buildNav();
        updateHeader();
    }

    // ================== HOME ==================
    function renderProfileBanner() {
        const p = activeProfile();
        if (profiles.list.length > 1 || !/^Profile \d+$/.test(p.name)) return '';
        return `<div class="banner"><p><strong>Studying together?</strong> Give this profile a name and add one for each person. Progress, plan and streak are kept separately.</p>
            <button class="btn btn-secondary btn-sm" onclick="VE.showView('profiles')">Set up profiles</button></div>`;
    }

    function describeTask(t, ctx, isToday) {
        const log = ctx.log;
        switch (t.type) {
            case 'review': return {
                label: "Today's review", action: 'VE.startReview()', cta: 'Start',
                sub: isToday ? `${ctx.due} due &middot; ${ctx.newLeft} new to learn` : `Due items + about ${ctx.newPerDay} new`,
                done: isToday && ctx.due === 0 && ctx.newLeft === 0 };
            case 'unit': {
                const u = t.unit;
                const kind = u.type === 'chapter' ? 'Read the chapter' : u.type === 'scenario' ? 'Walk through the scenario' : 'Study the section, then tick it off';
                return { label: u.label, sub: kind, action: `VE.openUnit('${u.id}')`, cta: 'Open', done: unitDone(u, progress) };
            }
            case 'baseline': return { label: 'Baseline mock exam', sub: 'Find out where you stand. The score does not matter yet.', action: 'VE.startExam()', cta: 'Start', done: isToday && !!log.mock, mock: true };
            case 'mock': return { label: 'Full mock exam', sub: `${EXAM.questionsOnExam} questions, ${EXAM.durationMinutes} min, no notes. Then review every miss.`, action: 'VE.startExam()', cta: 'Start', done: isToday && !!log.mock, mock: true };
            case 'weak': return { label: 'Weak-spot drill', sub: 'Re-drill the questions you keep missing', action: 'VE.startWeakDrill(0)', cta: 'Drill', done: isToday && !!log.weak };
            case 'numbers': return { label: 'Numbers & dates drill', sub: 'The facts people mix up under pressure', action: "VE.startNumbers('auto', 0)", cta: 'Drill', done: isToday && !!log.num };
            case 'cheatsheet': return { label: 'Skim the cheat sheet, then rest', sub: 'Light revision only. Sleep matters more tonight.', action: "VE.showView('cheatsheet')", cta: 'Open', done: isToday && !!log.cheat };
            case 'examday': return { label: 'Exam day', sub: 'Bring your ID. Answer every question: a blank is always wrong, a guess is right 1 time in 4.', action: "VE.showView('cheatsheet')", cta: 'Cheat sheet', done: false };
            default: return { label: t.type, sub: '', action: '', done: false };
        }
    }

    function renderTodayCard() {
        const ctx = todayContext();
        const plan = ctx.plan;
        const first = plan.days[0];
        const tasks = first.tasks.map(t => describeTask(t, ctx, true));
        const doneN = tasks.filter(t => t.done).length;
        let title;
        if (plan.assumed) title = 'Set your exam date for a day-by-day plan';
        else if (plan.daysLeft > 1) title = `${plan.daysLeft} days to your exam`;
        else if (plan.daysLeft === 1) title = 'Your exam is tomorrow';
        else if (plan.daysLeft === 0) title = 'Exam day. Good luck!';
        else title = 'Your exam date has passed';
        const reviewN = ctx.due + ctx.newLeft;
        return `
            <section class="card today-card" aria-labelledby="today-title">
                <div class="today-head">
                    <div>
                        <div class="eyebrow">Today &middot; ${formatDay(ctx.today)}</div>
                        <div class="today-title" id="today-title">${title}</div>
                        ${plan.assumed ? `<p class="today-note">Until then the plan assumes 30 days. <button class="btn-link" onclick="VE.showView('plan')">Set exam date</button></p>` : ''}
                        ${plan.daysLeft < 0 ? `<p class="today-note"><button class="btn-link" onclick="VE.showView('plan')">Update the exam date</button></p>` : ''}
                    </div>
                    <div class="streak${ctx.streak.activeToday ? ' is-on' : ''}" title="Days in a row with at least one study action">${ctx.streak.streak}<span>day streak</span></div>
                </div>

                            ${t.action ? `<button class="btn btn-secondary btn-sm task-go" onclick="${t.action}"${t.done ? ' aria-label="Again"' : ''}>${t.done ? 'Again' : t.cta}</button>` : ''}
                            <span class="sr-only">${t.done ? 'Done' : 'Not done'}</span>
                        </li>`).join('')}
                </ul>
                <div class="actions">
                    <button class="btn btn-primary" onclick="VE.startReview()">${reviewN ? `Start today's review &middot; ${reviewN}` : 'Review is clear: learn extra'}</button>
                    <button class="btn btn-secondary" onclick="VE.showView('plan')">Full plan</button>
                </div>
                <p class="ready-note">${doneN} of ${tasks.length} tasks done today.</p>
            </section>`;
    }

    function renderReadinessCard() {
        const r = estimateReadiness(progress, todayDay());
        const bestExam = progress.bestExam;
        const statsRow = `
            <div class="progress-stats">
                <div class="pstat"><span class="pval">${chapterReadCount()}/${CHAPTERS.length}</span><span class="plbl">Chapters read</span></div>
                <div class="pstat"><span class="pval">${Object.keys(progress.sectionsRead).length}/${PLAN_UNITS.filter(u => u.type === 'section').length}</span><span class="plbl">Sections studied</span></div>
                <div class="pstat${bestExam ? (bestExam.pct >= EXAM.passPct ? ' is-pass' : ' is-fail') : ''}"><span class="pval">${bestExam ? bestExam.pct + '%' : '&mdash;'}</span><span class="plbl">Best mock</span></div>
                <div class="pstat"><span class="pval">${questionsSeenCount()}/${QUESTIONS.length}</span><span class="plbl">Pool attempted</span></div>
            </div>`;
        if (!r.enough) {
            return `
                <section class="card">
                    <div class="eyebrow">Readiness</div>
                    <p style="margin-top:0.3rem">Not enough data yet. Answer about 20 questions or take a baseline mock and this card will estimate your chance of passing (${EXAM.passMark} of ${EXAM.questionsOnExam}).</p>
                    ${statsRow}
                    ${progress.quizAttempts.length ? '' : `<div class="actions"><button class="btn btn-secondary btn-sm" onclick="VE.importProgress()">Import a backup into this profile</button></div>`}
                </section>`;
        }
        const pp = Math.round(r.passProb * 100);
        const cls = pp >= 80 ? 'is-good' : pp >= 50 ? 'is-mid' : 'is-low';
        const passLine = EXAM.passMark / EXAM.questionsOnExam * 100;
        const worst = MODS.slice().sort((a, b) => r.modules[a].p - r.modules[b].p)[0];
        return `
            <section class="card">
                <div class="eyebrow">Readiness &middot; <span class="conf-tag">${r.confidence} confidence</span></div>
                <div class="ready-top" style="margin-top:0.4rem">
                    <div class="ready-big ${cls}">${pp}%</div>
                    <div class="ready-sub">estimated chance of passing today. Expected score <strong>${r.expected.toFixed(1)} / ${EXAM.questionsOnExam}</strong>, pass mark ${EXAM.passMark}.
                        ${r.modules[worst].p * 100 < passLine ? ` Weakest: <strong>${ML[worst]}</strong> (${mixOf(worst)} questions on the exam).` : ''}</div>
                </div>
                <div style="margin-top:0.8rem">
                    ${MODS.map(m => {
                        const mm = r.modules[m];
                        const pct = Math.round(mm.p * 100);
                        return `
                        <div class="mod-bar-row">
                            <span class="mod-bar-label"><span class="module-badge module-${m}">M${m}</span> ${ML[m]} <span class="mod-weight">${mixOf(m)} Qs &middot; ${Math.round(mm.coverage * 100)}% seen</span></span>
                            <div class="mod-bar" role="img" aria-label="${ML[m]}: estimated ${pct}% per question"><div class="mod-bar-fill mod-fill-${m}" style="width:${pct}%"></div><div class="pass-tick" style="left:${passLine}%"></div></div>
                            <span class="mod-bar-val">${pct}%</span>
                        </div>`;
                    }).join('')}
                </div>
                ${statsRow}
                <p class="ready-note">Estimate from your answer history and scheduler state across the whole question pool${r.mocks ? `, plus ${plural(r.mocks, 'recent mock')}` : ''}. Unseen questions count as educated guesses. The tick on each bar is the ${EXAM.passPct}% pass line.</p>
            </section>`;
    }
